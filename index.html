Name="w-full flex items-center gap-3 p-4 rounded-xl bg-zinc-900 border border-zinc-800 text-left active:bg-zinc-800 transition-colors">\n        <Upload size={18} className="text-cyan-400 flex-shrink-0"/>\n        <div className="flex-1">\n          <div className="font-bold text-sm">Import / Restore</div>\n          <div className="text-[11px] text-zinc-600 mt-0.5">Paste previously exported JSON to restore</div>\n        </div>\n        <ChevronRight size={14} className="text-zinc-600"/>\n      </button>\n\n      <button onClick={onReset}\n        className="w-full flex items-center gap-3 p-4 rounded-xl bg-zinc-900 border border-red-950/60 text-left active:bg-zinc-800 transition-colors">\n        <Trash2 size={18} className="text-red-500 flex-shrink-0"/>\n        <div className="flex-1">\n          <div className="font-bold text-sm text-red-400">Reset All Data</div>\n          <div className="text-[11px] text-zinc-600 mt-0.5">Wipe library and loadouts, restore defaults</div>\n        </div>\n        <ChevronRight size={14} className="text-red-900"/>\n      </button>\n      <p className="text-center text-[10px] text-zinc-700 tracking-wider pt-2">DATA STORED IN BROWSER · EXPORT REGULARLY</p>\n    </div>\n  );\n});\n\n// ─── Item Editor ──────────────────────────────────────────────────────────────\nfunction ItemEditor({item, onSave, onCancel, onDelete, showToast}) {\n  const isNew = !item;\n  const [form, setForm] = useState(()=>({id:uid(), name:\'\', brand:\'\', category:\'Misc\', weight:null, unit:\'oz\', details:\'\', qty:1, weightLb:0, weightOz_lb:0, ...(item||{})}));\n  const [fetching, setFetching] = useState(false);\n  const [result,   setResult]   = useState(null);\n  const set = p => setForm(f=>({...f,...p}));\n\n  const handleFetch = async () => {\n    if (!form.name.trim()) { showToast(\'Enter a name first\',\'error\'); return; }\n    setFetching(true); setResult(null);\n    try {\n      const r = await aiWeightLookup(form.name, form.brand, form.details);\n      setResult(r);\n      if (r.status===\'exact\' && r.weight_oz!=null) { set({weight:+r.weight_oz.toFixed(2),unit:\'oz\'}); showToast(\'Weight found ✓\',\'success\'); }\n      else if (r.status===\'estimate\') showToast(\'Estimated weight available\',\'info\');\n      else showToast(r.status===\'ambiguous\'?\'Multiple variants found\':\'No weight found\',\'error\');\n    } catch { setResult({status:\'not_found\',note:\'Lookup failed — check connection\'}); showToast(\'Fetch failed\',\'error\'); }\n    finally { setFetching(false); }\n  };\n\n  const save = () => {\n    if (!form.name.trim()) { showToast(\'Name required\',\'error\'); return; }\n    let w, unit;\n    if (form.unit === \'lboz\') {\n      // Convert lb+oz to grams, store as grams with unit=\'g\'\n      const lb = parseFloat(form.weightLb)||0;\n      const oz = parseFloat(form.weightOz_lb)||0;\n      w    = lb*453.592 + oz*28.3495;\n      unit = \'g\';\n    } else {\n      w    = (form.weight===\'\'||form.weight==null) ? null : parseFloat(form.weight);\n      unit = form.unit;\n    }\n    const qty = Math.max(1, parseInt(form.qty)||1);\n    onSave({...form, name:form.name.trim(), brand:(form.brand||\'\').trim(), details:(form.details||\'\').trim(),\n            weight:isNaN(w)?null:w, unit, qty});\n  };\n\n  const STATUS_STYLE = {\n    exact:\'bg-emerald-950/50 border-emerald-900/50 text-emerald-200\',\n    estimate:\'bg-violet-950/50 border-violet-900/50 text-violet-200\',\n    ambiguous:\'bg-amber-950/50 border-amber-900/50 text-amber-200\',\n    not_found:\'bg-zinc-800/80 border-zinc-700 text-zinc-400\',\n  };\n  const STATUS_TITLE = {\n    exact:`FOUND · ${(result?.confidence||\'medium\').toUpperCase()}`,\n    estimate:`ESTIMATED · ${(result?.confidence||\'medium\').toUpperCase()}`,\n    ambiguous:\'AMBIGUOUS — MULTIPLE VARIANTS\',\n    not_found:\'NOT FOUND\',\n  };\n\n  return (\n    <Modal title={isNew?\'New Item\':\'Edit Item\'} onClose={onCancel}>\n      <div className="space-y-3">\n        <SectionLabel>ITEM INFO</SectionLabel>\n        <Field label="Name *"><input value={form.name} onChange={e=>{set({name:e.target.value});setResult(null);}} placeholder="e.g., Kakwa 40" className="inp"/></Field>\n        <div className="grid grid-cols-2 gap-2">\n          <Field label="Brand"><input value={form.brand||\'\'} onChange={e=>{set({brand:e.target.value});setResult(null);}} placeholder="e.g., Durston" className="inp"/></Field>\n          <Field label="Category">\n            <select value={form.category} onChange={e=>set({category:e.target.value})} className="inp appearance-none">\n              {CATEGORIES.map(c=><option key={c}>{c}</option>)}\n            </select>\n          </Field>\n        </div>\n        <Field label="Details · size · variant (helps AI)">\n          <textarea value={form.details||\'\'} onChange={e=>{set({details:e.target.value});setResult(null);}} placeholder="e.g., Large, Regular length, 2024 model, blue…" rows={2} className="inp resize-none leading-relaxed"/>\n        </Field>\n\n        <SectionLabel>WEIGHT LOOKUP</SectionLabel>\n        <button onClick={handleFetch} disabled={fetching||!form.name.trim()}\n          className={`w-full flex items-center justify-center gap-2 py-3 rounded-xl text-xs font-bold tracking-wider transition-all ${\n            fetching?\'bg-zinc-800 text-zinc-500\':!form.name.trim()?\'bg-zinc-900 text-zinc-700\':\'bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white active:opacity-80 shadow-md shadow-violet-500/20\'}`}>\n          {fetching\n            ? <><span className="w-3.5 h-3.5 border-2 border-zinc-500 border-t-zinc-200 rounded-full spin"/> <span className="pulse">SEARCHING WEB…</span></>\n            : <><Sparkles size={14}/> FETCH WEIGHT</>}\n        </button>\n\n        {result && !fetching && (\n          <div className={`rounded-xl border p-3 text-xs ${STATUS_STYLE[result.status]||STATUS_STYLE.not_found}`}>\n            <div className="font-bold tracking-wider text-[10px] mb-1">{STATUS_TITLE[result.status]}</div>\n            <div className="opacity-80 leading-relaxed">{result.note}</div>\n            {result.source && <div className="mt-0.5 opacity-50 text-[10px]">Source: {result.source}</div>}\n            {result.status===\'ambiguous\' && result.variants?.map((v,i)=><div key={i} className="opacity-70 mt-0.5">• {v}</div>)}\n            {result.status===\'estimate\' && result.estimate_oz!=null && (\n              <button onClick={()=>{set({weight:+result.estimate_oz.toFixed(2),unit:\'oz\'});showToast(\'Estimate applied\',\'info\');}}\n                className="mt-2 flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-violet-500/20 border border-violet-500/40 text-violet-200 text-[11px] font-bold active:bg-violet-500/30">\n                <RefreshCw size={11}/> USE ESTIMATE ({result.estimate_oz.toFixed(1)} oz)\n              </button>\n            )}\n          </div>\n        )}\n\n        <SectionLabel>WEIGHT</SectionLabel>\n        {/* Unit selector */}\n        <div className="flex gap-1">\n          {[\'oz\',\'lboz\',\'g\'].map(u=>(\n            <button key={u} onClick={()=>set({unit:u})}\n              className={`flex-1 py-2 rounded-lg text-xs font-bold tracking-wide active:scale-95 transition-all ${form.unit===u?\'bg-orange-500 text-zinc-950\':\'bg-zinc-800 text-zinc-500\'}`}>\n              {u===\'lboz\'?\'LB + OZ\':u.toUpperCase()}\n            </button>\n          ))}\n        </div>\n\n        {form.unit===\'lboz\' ? (\n          /* Dual lb + oz input */\n          <div className="grid grid-cols-2 gap-2">\n            <Field label="Pounds (lb)">\n              <input type="number" min="0" step="1" inputMode="numeric"\n                value={form.weightLb??\'\'} onChange={e=>set({weightLb:e.target.value})}\n                placeholder="0" className="inp tabular-nums"/>\n            </Field>\n            <Field label="Ounces (oz)">\n              <input type="number" min="0" max="15.9" step="0.1" inputMode="decimal"\n                value={form.weightOz_lb??\'\'} onChange={e=>set({weightOz_lb:e.target.value})}\n                placeholder="0.0" className="inp tabular-nums"/>\n            </Field>\n          </div>\n        ) : (\n          <Field label={`Weight (${form.unit})`}>\n            <input type="number" step="0.01" min="0" inputMode="decimal"\n              value={form.weight??\'\'} onChange={e=>set({weight:e.target.value})}\n              placeholder={`Enter weight in ${form.unit}`} className="inp tabular-nums"/>\n          </Field>\n        )}\n\n        {/* Live conversion hint */}\n        {(()=>{\n          let g = 0;\n          if (form.unit===\'lboz\') {\n            g = (parseFloat(form.weightLb)||0)*453.592 + (parseFloat(form.weightOz_lb)||0)*28.3495;\n          } else {\n            const w = parseFloat(form.weight);\n            if (!isNaN(w) && w > 0) {\n              if (form.unit===\'oz\') g = w*28.3495;\n              else if (form.unit===\'g\') g = w;\n            }\n          }\n          if (g <= 0) return null;\n          const oz = g/28.3495;\n          const lb = Math.floor(g/453.592);\n          const remOz = (g - lb*453.592)/28.3495;\n          const lbStr = lb>0 ? `${lb} lb ${remOz.toFixed(1)} oz` : `${oz.toFixed(2)} oz`;\n          return (\n            <div className="text-[10px] text-zinc-600 px-1">\n              = {lbStr} · {Math.round(g)}g\n            </div>\n          );\n        })()}\n\n        {/* Quantity */}\n        <SectionLabel>QUANTITY</SectionLabel>\n        <div className="flex items-center gap-3">\n          <div className="flex-1">\n            <div className="text-sm font-bold">Items of this type</div>\n            <div className="text-[10px] text-zinc-500 mt-0.5">Weight above is per individual item</div>\n          </div>\n          <div className="flex items-center gap-2">\n            <button onClick={()=>set({qty:Math.max(1,(parseInt(form.qty)||1)-1)})}\n              className="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-200 text-xl font-bold flex items-center justify-center active:bg-zinc-700">−</button>\n            <div className="w-10 text-center font-bold tabular-nums text-sm">{form.qty||1}</div>\n            <button onClick={()=>set({qty:Math.min(20,(parseInt(form.qty)||1)+1)})}\n              className="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-200 text-xl font-bold flex items-center justify-center active:bg-zinc-700">+</button>\n          </div>\n        </div>\n\n        <div className="flex gap-2 pt-1">\n          {onDelete && <button onClick={onDelete} className="px-4 py-3.5 rounded-xl bg-red-950/50 text-red-400 active:bg-red-900/60"><Trash2 size={16}/></button>}\n          <button onClick={onCancel} className="flex-1 py-3.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold tracking-wider active:bg-zinc-700">CANCEL</button>\n          <button onClick={save} className="flex-1 py-3.5 rounded-xl bg-orange-500 text-zinc-950 text-xs font-bold tracking-wider active:bg-orange-400 shadow-md shadow-orange-500/20">SAVE</button>\n        </div>\n      </div>\n    </Modal>\n  );\n}\n\n// ─── Preset Editor ────────────────────────────────────────────────────────────\nfunction PresetEditor({preset, onSave, onDelete, onCancel}) {\n  const [name, setName] = useState(preset?.name||\'\');\n  return (\n    <Modal title={preset?\'Edit Loadout\':\'New Loadout\'} onClose={onCancel}>\n      <div className="space-y-3">\n        <Field label="Loadout Name"><input value={name} onChange={e=>setName(e.target.value)} autoFocus placeholder="e.g., ADK Winter, Fastpack" className="inp"/></Field>\n        <div className="flex gap-2 pt-1">\n          {onDelete && <button onClick={()=>{if(confirm(`Delete "${preset.name}"?`))onDelete();}} className="px-4 py-3.5 rounded-xl bg-red-950/50 text-red-400 active:bg-red-900/60"><Trash2 size={16}/></button>}\n          <button onClick={onCancel} className="flex-1 py-3.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold">CANCEL</button>\n          <button onClick={()=>onSave(name)} disabled={!name.trim()} className="flex-1 py-3.5 rounded-xl bg-orange-500 text-zinc-950 text-xs font-bold disabled:opacity-40">SAVE</button>\n        </div>\n      </div>\n    </Modal>\n  );\n}\n\n// ─── Modal ────────────────────────────────────────────────────────────────────\nfunction Modal({title, children, onClose}) {\n  const ref = useRef(null);\n  // Use a ref for onClose so the effect never re-runs due to new function references\n  const onCloseRef = useRef(onClose);\n  useEffect(() => { onCloseRef.current = onClose; }, [onClose]);\n  useEffect(()=>{\n    const esc = e => { if (e.key===\'Escape\') onCloseRef.current(); };\n    window.addEventListener(\'keydown\', esc);\n    document.body.style.overflow = \'hidden\';\n    return () => { window.removeEventListener(\'keydown\', esc); document.body.style.overflow = \'\'; };\n  }, []); // empty deps — only runs once on mount/unmount\n  useEffect(()=>{\n    const el = ref.current; if (!el) return;\n    const scroll = t => setTimeout(()=>{ try{ t.scrollIntoView({behavior:\'smooth\',block:\'center\'}); }catch{} }, 320);\n    const onFocus = e => { if ([\'INPUT\',\'TEXTAREA\',\'SELECT\'].includes(e.target.tagName)) scroll(e.target); };\n    const onVP    = () => { const a=document.activeElement; if(a&&[\'INPUT\',\'TEXTAREA\'].includes(a.tagName)) scroll(a); };\n    el.addEventListener(\'focusin\', onFocus);\n    window.visualViewport?.addEventListener(\'resize\', onVP);\n    return () => { el.removeEventListener(\'focusin\', onFocus); window.visualViewport?.removeEventListener(\'resize\', onVP); };\n  }, []);\n  return (\n    <div className="fixed inset-0 z-50 flex justify-center items-end sm:items-center" style={{animation:\'fadeIn .15s ease-out\'}}>\n      <div className="absolute inset-0 bg-black/65 backdrop-blur-sm" onClick={onClose}/>\n      <div ref={ref}\n        className="relative w-full sm:max-w-lg bg-zinc-900 rounded-t-3xl sm:rounded-2xl border-t sm:border border-zinc-800 overflow-y-auto overscroll-contain mt-auto sm:mt-0"\n        style={{maxHeight:\'92dvh\', animation:\'sheetUp .2s ease-out\', fontFamily:"\'JetBrains Mono\',ui-monospace,monospace", paddingBottom:\'env(safe-area-inset-bottom,0px)\'}}>\n        <div className="sm:hidden flex justify-center pt-2.5 pb-1"><div className="w-9 h-1 rounded-full bg-zinc-700"/></div>\n        <div className="sticky top-0 bg-zinc-900 z-10 flex items-center justify-between px-4 py-3 border-b border-zinc-800">\n          <span className="text-xs font-bold tracking-[.18em]">{title.toUpperCase()}</span>\n          <button onClick={onClose} className="p-1.5 -mr-1 text-zinc-500 active:text-zinc-200"><X size={18}/></button>\n        </div>\n        <div className="px-4 py-4 pb-8">{children}</div>\n      </div>\n    </div>\n  );\n}\n\n// ─── Helpers ──────────────────────────────────────────────────────────────────\nfunction Field({label, children}) {\n  return <div><div className="text-[10px] tracking-[.18em] text-zinc-500 mb-1">{label}</div>{children}</div>;\n}\nfunction SectionLabel({children}) {\n  return (\n    <div className="flex items-center gap-2 pt-1">\n      <div className="text-[10px] tracking-[.18em] text-zinc-600 font-bold">{children}</div>\n      <div className="flex-1 h-px bg-zinc-800"/>\n    </div>\n  );\n}\n\n\n// ─── Mount ────────────────────────────────────────────────────────────────────\nconst root = ReactDOM.createRoot(document.getElementById(\'root\'));\nroot.render(<PackAnalyst />);\n\n  ';
      var compiled = sucrase.transform(jsx, {transforms: ['jsx']}).code;
      var script = document.createElement('script');
      script.textContent = compiled;
      document.head.appendChild(script);
    } catch(e) {
      document.getElementById('root').innerHTML =
        '<pre style="color:red;padding:20px;font-size:11px;background:#09090b;white-space:pre-wrap;word-break:break-all;">COMPILE ERROR:\n' + e.message + '\n' + (e.stack||'') + '</pre>';
    }
  })();
</script>
</body>
