// ─── Helpers ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);

const toGrams = (w, unit) => {
  const n = parseFloat(w);
  if (w == null || w === '' || isNaN(n) || n < 0) return 0;
  if (unit === 'oz') return n * 28.3495;
  if (unit === 'lb' || unit === 'lboz') return n * 453.592; // lboz items are saved as 'g' now
  return n;
};
const fmtImp = (g) => {
  if (!g || g <= 0) return { main:'0', sub:'oz' };
  const oz = g / 28.3495;
  if (oz < 16) return { main: oz.toFixed(oz < 10 ? 2 : 1), sub:'oz' };
  const lb = Math.floor(g / 453.592);
  const remOz = (g - lb * 453.592) / 28.3495;
  return { main:`${lb}`, sub:`lb ${remOz.toFixed(1)} oz` };
};
const fmtMet = (g) => {
  if (!g || g <= 0) return { main:'0', sub:'g' };
  if (g < 1000) return { main: Math.round(g).toString(), sub:'g' };
  return { main:(g/1000).toFixed(2), sub:'kg' };
};

// ─── Fuel calculation ─────────────────────────────────────────────────────────
function calcFuel(tripSim) {
  const { days=1, groupSize=1, canisterId='100', canisterQty=1, customFuelG=100, customCanisterG=93 } = tripSim;
  const canister = CANISTERS.find(c=>c.id===canisterId) || CANISTERS[0];
  const fuelG    = canisterId==='custom' ? parseFloat(customFuelG)||0 : canister.fuelG;
  const bodyG    = canisterId==='custom' ? parseFloat(customCanisterG)||0 : canister.canisterG;
  const totalStartG = (fuelG + bodyG) * canisterQty;

  const neededFuelG = FUEL_PER_PAX_PER_DAY_G * days * groupSize;
  const availFuelG  = fuelG * canisterQty;
  const sufficient  = availFuelG >= neededFuelG;

  return { totalStartG, neededFuelG, availFuelG, sufficient, fuelG, bodyG, canisterQty };
}

// ─── Consumable total for a preset ──────────────────────────────────────────
function calcConsumable(preset) {
  const ts = { ...DEFAULT_TRIP, ...(preset?.tripSim||{}) };

  // Water: max you carry at once × group size (it only goes down, never up)
  const waterG = (parseFloat(ts.maxWaterL)||0) * 1000 * (ts.groupSize||1);
  // Fuel: full canister(s) starting weight
  const { totalStartG: fuelTotalG } = calcFuel(ts);
  // Food: flat total per person × group size
  const foodG = (parseFloat(ts.foodWeightOz)||0) * 28.3495 * (ts.groupSize||1);

  return { waterG, fuelTotalG, foodG, total: waterG + fuelTotalG + foodG };
}
