   brand:\'HydraPak\',       category:\'Hydration\' },\n  { name:\'Stow Bottle 1L\',             brand:\'HydraPak\',       category:\'Hydration\' },\n  { name:\'Migos Bottle\',               brand:\'Migos\',          category:\'Hydration\' },\n  { name:\'X-Mid 2P\',                   brand:\'Durston\',        category:\'Shelter\'   },\n];\n\n// ─── Helpers ──────────────────────────────────────────────────────────────────\nconst uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);\n\nconst toGrams = (w, unit) => {\n  const n = parseFloat(w);\n  if (w == null || w === \'\' || isNaN(n) || n < 0) return 0;\n  if (unit === \'oz\') return n * 28.3495;\n  if (unit === \'lb\' || unit === \'lboz\') return n * 453.592; // lboz items are saved as \'g\' now\n  return n;\n};\nconst fmtImp = (g) => {\n  if (!g || g <= 0) return { main:\'0\', sub:\'oz\' };\n  const oz = g / 28.3495;\n  if (oz < 16) return { main: oz.toFixed(oz < 10 ? 2 : 1), sub:\'oz\' };\n  const lb = Math.floor(g / 453.592);\n  const remOz = (g - lb * 453.592) / 28.3495;\n  return { main:`${lb}`, sub:`lb ${remOz.toFixed(1)} oz` };\n};\nconst fmtMet = (g) => {\n  if (!g || g <= 0) return { main:\'0\', sub:\'g\' };\n  if (g < 1000) return { main: Math.round(g).toString(), sub:\'g\' };\n  return { main:(g/1000).toFixed(2), sub:\'kg\' };\n};\n\n// ─── Default trip sim ─────────────────────────────────────────────────────────\nconst DEFAULT_TRIP = {\n  days: 1, groupSize: 1,\n  maxWaterL: 2,        // max water carried at one time (not per day)\n  foodWeightOz: 0,     // total food weight for whole trip per person\n  canisterId: \'100\', canisterQty: 1,\n  customFuelG: 100, customCanisterG: 93,\n};\n\n// ─── Initial state ─────────────────────────────────────────────────────────────\nconst buildInitial = () => {\n  const items = SEED.map(s => ({\n    id:uid(), name:s.name, brand:s.brand, category:s.category,\n    weight:null, unit:\'oz\', details:\'\', qty:1,\n  }));\n  const p = { id:uid(), name:\'Solo Overnight\', selections:{}, tripSim:{...DEFAULT_TRIP}, mealPlan:{meals:[]}, clothingPlan:{items:{},customItems:[]} };\n  return { items, presets:[p], activePresetId:p.id, displayUnit:\'imperial\' };\n};\n\n// ─── Fuel calculation ─────────────────────────────────────────────────────────\nfunction calcFuel(tripSim) {\n  const { days=1, groupSize=1, canisterId=\'100\', canisterQty=1, customFuelG=100, customCanisterG=93 } = tripSim;\n  const canister = CANISTERS.find(c=>c.id===canisterId) || CANISTERS[0];\n  const fuelG    = canisterId===\'custom\' ? parseFloat(customFuelG)||0 : canister.fuelG;\n  const bodyG    = canisterId===\'custom\' ? parseFloat(customCanisterG)||0 : canister.canisterG;\n  const totalStartG = (fuelG + bodyG) * canisterQty;\n\n  const neededFuelG = FUEL_PER_PAX_PER_DAY_G * days * groupSize;\n  const availFuelG  = fuelG * canisterQty;\n  const sufficient  = availFuelG >= neededFuelG;\n\n  return { totalStartG, neededFuelG, availFuelG, sufficient, fuelG, bodyG, canisterQty };\n}\n\n// ─── Consumable total for a preset ──────────────────────────────────────────\nfunction calcConsumable(preset) {\n  const ts = { ...DEFAULT_TRIP, ...(preset?.tripSim||{}) };\n\n  // Water: max you carry at once × group size (it only goes down, never up)\n  const waterG = (parseFloat(ts.maxWaterL)||0) * 1000 * (ts.groupSize||1);\n  // Fuel: full canister(s) starting weight\n  const { totalStartG: fuelTotalG } = calcFuel(ts);\n  // Food: flat total per person × group size\n  const foodG = (parseFloat(ts.foodWeightOz)||0) * 28.3495 * (ts.groupSize||1);\n\n  return { waterG, fuelTotalG, foodG, total: waterG + fuelTotalG + foodG };\n}\n\n// ─── AI weight lookup ─────────────────────────────────────────────────────────\nasync function aiWeightLookup(name, brand, details) {\n  const query = [brand, name, details].filter(Boolean).join(\' — \');\n  const system = `Outdoor gear weight lookup. Search for the exact manufacturer-listed weight.\nRespond ONLY with valid JSON (no markdown, no backticks):\n{"status":"exact"|"estimate"|"ambiguous"|"not_found","weight_oz":number|null,"estimate_oz":number|null,"confidence":"high"|"medium"|"low","source":string,"note":string,"variants":string[]|null}\nRules: exact=found precise spec; estimate=found item but variant unclear; ambiguous=multiple products; not_found=no data.\nsource≤8 words. note≤12 words. Conservative — prefer estimate over exact when unsure.`;\n\n  const res = await fetch(\'https://api.anthropic.com/v1/messages\', {\n    method:\'POST\', headers:{\'Content-Type\':\'application/json\'},\n    body: JSON.stringify({\n      model:AI_MODEL, max_tokens:400, system,\n      messages:[{role:\'user\', content:`Item: ${query}`}],\n      tools:[{type:\'web_search_20250305\', name:\'web_search\'}],\n    }),\n  });\n  if (!res.ok) throw new Error(`API ${res.status}`);\n  const data = await res.json();\n  const text = (data.content||[]).filter(b=>b.type===\'text\').map(b=>b.text).join(\'\\n\');\n  const m = text.match(/\\{[\\s\\S]*?\\}/);\n  if (!m) throw new Error(\'No JSON\');\n  const p = JSON.parse(m[0]);\n  if (p.status!==\'exact\')    p.weight_oz   = null;\n  if (p.status!==\'estimate\') p.estimate_oz = null;\n  return p;\n}\n\n// ─── App ──────────────────────────────────────────────────────────────────────\nfunction PackAnalyst() {\n  const [state, setState] = useState(() => {\n    try {\n      const raw = localStorage.getItem(STORAGE_KEY);\n      if (raw) { const p = JSON.parse(raw); if (p?.items) return p; }\n    } catch {}\n    return buildInitial();\n  });\n\n  const [view,       setView]       = useState(\'preset\');\n  const [editItem,   setEditItem]   = useState(null);\n  const [editPreset, setEditPreset] = useState(null);\n  const [filterCat,  setFilterCat]  = useState(\'All\');\n  const [simModal,   setSimModal]   = useState(false);\n  const [foodModal,  setFoodModal]  = useState(false);\n  const [clothingModal, setClothingModal] = useState(false);\n  // Stable close handlers — won\'t cause Modal useEffect to re-run\n  const closeSimModal      = useCallback(() => setSimModal(false), []);\n  const closeFoodModal     = useCallback(() => setFoodModal(false), []);\n  const closeClothingModal = useCallback(() => setClothingModal(false), []);\n  const closeEditItem      = useCallback(() => setEditItem(null), []);\n  const closeEditPreset    = useCallback(() => setEditPreset(null), []);\n  const [toast,      setToast]      = useState(null);\n\n  // Debounced localStorage persist — avoids blocking main thread on every tap\n  const persistTimer = useRef(null);\n  useEffect(() => {\n    if (persistTimer.current) clearTimeout(persistTimer.current);\n    persistTimer.current = setTimeout(() => {\n      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}\n    }, 400);\n    return () => { if (persistTimer.current) clearTimeout(persistTimer.current); };\n  }, [state]);\n\n  const activePreset = useMemo(\n    () => state.presets.find(p => p.id === state.activePresetId) || state.presets[0],\n    [state.presets, state.activePresetId]\n  );\n\n  const showToast = useCallback((msg, type=\'info\') => {\n    setToast({msg, type});\n    setTimeout(() => setToast(null), 2600);\n  }, []);\n\n  const fmt = useCallback(g => state.displayUnit===\'metric\' ? fmtMet(g) : fmtImp(g), [state.displayUnit]);\n\n  // ── Stats ──\n  const stats = useMemo(() => {\n    const sel    = activePreset?.selections || {};\n    const picked = state.items.filter(it => sel[it.id]);\n    let base = 0;\n    const byCat  = {};\n    picked.forEach(it => {\n      const selVal = sel[it.id];\n      // selVal may be {selected,qty} or legacy true/1\n      const selQty = (selVal && typeof selVal===\'object\') ? (parseInt(selVal.qty)||1) : 1;\n      // Item\'s own default qty from library\n      const itemQty = Math.max(1, parseInt(it.qty)||1);\n      const qty = selQty > 0 ? selQty : itemQty;\n      const g = toGrams(it.weight, it.unit) * qty;\n      base += g;\n      byCat[it.category] = (byCat[it.category]||0) + g;\n    });\n    // Add clothing weight to base (clothing plan per preset)\n    const cPlan = activePreset?.clothingPlan || {};\n    const cItems = cPlan.items || {};\n    let clothingG = 0;\n    // Standard items\n    CLOTHING_ITEMS.forEach(ci => {\n      const sel = cItems[ci.id];\n      if (!sel?.selected) return;\n      const qty = Math.max(1, parseInt(sel.qty)||1);\n      const oz  = parseFloat(sel.weightOz ?? ci.defaultOz) || 0;\n      clothingG += oz * 28.3495 * qty;\n    });\n    // Custom clothing items\n    (cPlan.customItems||[]).forEach(ci => {\n      if (!ci.selected) return;\n      const qty = Math.max(1, parseInt(ci.qty)||1);\n      const oz  = parseFloat(ci.weightOz)||0;\n      clothingG += oz * 28.3495 * qty;\n    });\n    if (clothingG > 0) byCat[\'Apparel\'] = (byCat[\'Apparel\']||0) + clothingG;\n    base += clothingG;\n\n    return { base, byCat, count:picked.length, missing: picked.filter(it=>it.weight==null||it.weight===\'\').length, clothingG };\n  }, [activePreset, state.items]);\n\n  const consumable = useMemo(() => calcConsumable(activePreset), [activePreset]);\n  const totalG     = stats.base + consumable.total;\n\n  // ── Mutations ──\n  const upsertItem = item => {\n    const isUpd = state.items.some(i => i.id === item.id);\n    setState(s => ({\n      ...s,\n      items: isUpd\n        ? s.items.map(i => i.id===item.id ? item : i)\n        : [...s.items, {...item, id:item.id||uid()}],\n    }));\n    showToast(isUpd ? \'Updated\' : \'Added\', \'success\');\n  };\n\n  const deleteItem = id => {\n    setState(s => ({\n      ...s,\n      items: s.items.filter(i => i.id!==id),\n      presets: s.presets.map(p => {\n        const sel = {...p.selections}; delete sel[id];\n        return {...p, selections:sel};\n      }),\n    }));\n    showToast(\'Deleted\');\n  };\n\n  const toggleItem = id => {\n    setState(s => {\n      const p = s.presets.find(x => x.id===s.activePresetId);\n      if (!p) return s;\n      const sel = {...p.selections};\n      sel[id] ? delete sel[id] : (sel[id] = {selected:true, qty:1});\n      return {...s, presets: s.presets.map(x => x.id===p.id ? {...x, selections:sel} : x)};\n    });\n  };\n\n  const updateItemQtyInPreset = (itemId, qty) => {\n    setState(s => {\n      const p = s.presets.find(x => x.id===s.activePresetId);\n      if (!p) return s;\n      const sel = {...p.selections};\n      if (sel[itemId] !== undefined) {\n        sel[itemId] = {selected:true, qty: Math.max(1, qty)};\n      }\n      return {...s, presets: s.presets.map(x => x.id===p.id ? {...x, selections:sel} : x)};\n    });\n  };\n\n  const updateClothingPlan = useCallback(patch => {\n    setState(s => ({\n      ...s,\n      presets: s.presets.map(p =>\n        p.id===s.activePresetId\n          ? {...p, clothingPlan:{...(p.clothingPlan||{items:{},customItems:[]}), ...patch}}\n          : p\n      ),\n    }));\n  }, []);\n\n  const updateTripSim = useCallback(patch => {\n    setState(s => ({\n      ...s,\n      presets: s.presets.map(p =>\n        p.id===s.activePresetId\n          ? {...p, tripSim:{...DEFAULT_TRIP, ...(p.tripSim||{}), ...patch}}\n          : p\n      ),\n    }));\n  }, []);\n\n  const updateMealPlan = patch => {\n    setState(s => ({\n      ...s,\n      presets: s.presets.map(p =>\n        p.id===s.activePresetId\n          ? {...p, mealPlan:{...(p.mealPlan||{meals:[]}), ...patch}}\n          : p\n      ),\n    }));\n  };\n\n  const addPreset = name => {\n    if (!name?.trim()) return;\n    const p = { id:uid(), name:name.trim(), selections:{}, tripSim:{...DEFAULT_TRIP}, mealPlan:{meals:[]}, clothingPlan:{items:{},customItems:[]} };\n    setState(s => ({...s, presets:[...s.presets, p], activePresetId:p.id}));\n    showToast(`Created "${p.name}"`, \'success\');\n  };\n  const renamePreset = (id, name) =>\n    setState(s => ({...s, presets:s.presets.map(p => p.id===id ? {...p, name} : p)}));\n  const deletePreset = id => {\n    setState(s => {\n      const rem = s.presets.filter(p => p.id!==id);\n      if (!rem.length) {\n        const f = {id:uid(), name:\'New Loadout\', selections:{}, tripSim:{...DEFAULT_TRIP}, mealPlan:{meals:[]}, clothingPlan:{items:{},customItems:[]}};\n        return {...s, presets:[f], activePresetId:f.id};\n      }\n      return {...s, presets:rem, activePresetId:s.activePresetId===id ? rem[0].id : s.activePresetId};\n    });\n    showToast(\'Deleted\');\n  };\n  const dupPreset = id => {\n    setState(s => {\n      const src = s.presets.find(p => p.id===id);\n      if (!src) return s;\n      const c = {...src, id:uid(), name:`${src.name} (copy)`};\n      return {...s, presets:[...s.presets, c], activePresetId:c.id};\n    });\n    showToast(\'Duplicated\', \'success\');\n  };\n\n  // Export handled inside DataView via copy/paste\n\n  // Import handled inside DataView via copy/paste\n\n  const resetAll = () => {\n    if (!confirm(\'Reset everything? Your library and loadouts will be cleared.\')) return;\n    setState(buildInitial());\n    showToast(\'Reset to defaults\');\n  };\n\n  const missingInLibrary = state.items.filter(i => i.weight==null || i.weight===\'\').length;\n  const tripSim = { ...DEFAULT_TRIP, ...(activePreset?.tripSim||{}) };\n  const mealPlan = activePreset?.mealPlan || {meals:[]};\n\n\n  const NAV = [\n    [\'preset\',  \'LOADOUT\', <Package size={14}/>],\n    [\'library\', \'LIBRARY\', <Mountain size={14}/>],\n    [\'data\',    \'DATA\',    <Download size={14}/>],\n  ];\n\n  const modals = (\n    <>\n      {editItem && (\n        <ItemEditor\n          item={editItem===\'new\' ? null : editItem}\n          onSave={it => { upsertItem(it); setEditItem(null); }}\n          onCancel={closeEditItem}\n          onDelete={editItem!==\'new\' ? () => {\n            if (confirm(`Delete "${editItem.name}"?`)) { deleteItem(editItem.id); setEditItem(null); }\n          } : null}\n          showToast={showToast}\n        />\n      )}\n      {editPreset && (\n        <PresetEditor\n          preset={editPreset===\'new\' ? null : editPreset}\n          onSave={name => { editPreset===\'new\' ? addPreset(name) : renamePreset(editPreset.id, name); setEditPreset(null); }}\n          onDelete={editPreset===\'new\' ? null : () => { deletePreset(editPreset.id); setEditPreset(null); }}\n          onCancel={closeEditPreset}\n        />\n      )}\n      {simModal && (\n        <TripSimModal\n          tripSim={tripSim} mealPlan={mealPlan} consumable={consumable}\n          onChangeSim={updateTripSim}\n          fmt={fmt} onClose={closeSimModal}\n        />\n      )}\n      {foodModal && (\n        <FoodPlanModal\n          mealPlan={mealPlan} tripSim={tripSim}\n          onChange={updateMealPlan} onClose={closeFoodModal}\n        />\n      )}\n      {clothingModal && (\n        <ClothingModal\n          clothingPlan={activePreset?.clothingPlan||{items:{},customItems:[]}}\n          onChange={updateClothingPlan}\n          onClose={closeClothingModal}\n          fmt={fmt}\n        />\n      )}\n      {toast && (\n        <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-full text-xs font-bold tracking-wide shadow-2xl whitespace-nowrap\n          ${toast.type===\'error\'?\'bg-red-500 text-white\':toast.type===\'success\'?\'bg-emerald-400 text-zinc-950\':\'bg-zinc-200 text-zinc-900\'}`}\n          style={{animation:\'slideUp .2s ease-out\'}}>\n          {toast.msg}\n        </div>\n      )}\n    </>\n  );\n\n  const mainContent = (\n    <>\n      {view===\'preset\' && (\n        <PresetView\n          presets={state.presets} activePreset={activePreset} items={state.items}\n          filterCat={filterCat} setFilterCat={setFilterCat}\n          tripSim={tripSim} consumable={consumable} mealPlan={mealPlan}\n          onSetActive={id=>setState(s=>({...s,activePresetId:id}))}\n          onAddPreset={()=>setEditPreset(\'new\')}\n          onEditPreset={p=>setEditPreset(p)}\n          onDup={dupPreset}\n          onToggle={toggleItem}\n          onQtyChange={updateItemQtyInPreset}\n          onOpenSim={()=>setSimModal(true)}\n          onOpenFood={()=>setFoodModal(true)}\n          onOpenClothing={()=>setClothingModal(true)}\n          clothingPlan={activePreset?.clothingPlan||{items:{},customItems:[]}}\n          fmt={fmt}\n        />\n      )}\n      {view===\'library\' && (\n        <LibraryView\n          items={state.items} missingCount={missingInLibrary}\n          filterCat={filterCat} setFilterCat={setFilterCat}\n          onAdd={()=>setEditItem(\'new\')} onEdit={it=>setEditItem(it)} fmt={fmt}\n        />\n      )}\n      {view===\'data\' && (\n        <DataView\n          items={state.items} presets={state.presets} state={state}\n          onImport={parsed=>{ setState(parsed); showToast(\'Imported ✓\',\'success\'); }}\n          onReset={resetAll}\n        />\n      )}\n    </>\n  );\n\n  const globalStyle = (\n    <style>{`\n      @keyframes slideUp {from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}\n      @keyframes fadeIn  {from{opacity:0}to{opacity:1}}\n      @keyframes sheetUp {from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}\n      @keyframes spin    {to{transform:rotate(360deg)}}\n      @keyframes pulse   {0%,100%{opacity:1}50%{opacity:.4}}\n      *{-webkit-tap-highlight-color:transparent;}\n      input,textarea,select{font-size:16px!important;}\n      .spin {animation:spin 1s linear infinite;}\n      .pulse{animation:pulse 1.2s ease-in-out infinite;}\n      .inp{width:100%;background:#27272a;border:1px solid #3f3f46;border-radius:.6rem;padding:.7rem .75rem;color:#f4f4f5;outline:none;transition:border-color .15s;}\n      .inp:focus{border-color:#71717a;}\n      select.inp{cursor:pointer;}\n      ::-webkit-scrollbar{display:none;}\n    `}</style>\n  );\n\n  return (\n    <div className="bg-zinc-950 text-zinc-100 select-none"\n         style={{fontFamily:"\'JetBrains Mono\',ui-monospace,\'SF Mono\',Menlo,monospace",minHeight:\'100dvh\'}}>\n\n      <div className="fixed inset-0 pointer-events-none"\n           style={{background:\'radial-gradient(ellipse at 15% 0%,rgba(249,115,22,.09),transparent 55%),radial-gradient(ellipse at 85% 100%,rgba(59,130,246,.06),transparent 55%)\'}}/>\n\n      {/* ═══════════════════════════════════════════════\n          DESKTOP — fixed sidebar + scrollable content\n      ═══════════════════════════════════════════════ */}\n      <div className="hidden md:flex" style={{height:\'100dvh\'}}>\n\n        {/* Sidebar */}\n        <aside className="w-64 flex-shrink-0 flex flex-col bg-zinc-900/80 border-r border-zinc-800 overflow-y-auto">\n\n          {/* Brand + unit */}\n          <div className="px-4 pt-5 pb-4 border-b border-zinc-800 space-y-3">\n            <div className="flex items-center gap-2">\n              <Mountain size={15} className="text-orange-500" strokeWidth={2.5}/>\n              <span className="text-[11px] tracking-[.22em] font-bold">PACK ANALYST</span>\n            </div>\n            <div className="flex bg-zinc-950 border border-zinc-800 rounded-full p-0.5">\n              {[[\'imperial\',\'OZ / LB\'],[\'metric\',\'G / KG\']].map(([u,l])=>(\n                <button key={u} onClick={()=>setState(s=>({...s,displayUnit:u}))}\n                  className={`flex-1 py-1.5 rounded-full text-[10px] font-bold tracking-wider transition-all ${state.displayUnit===u?\'bg-orange-500 text-zinc-950\':\'text-zinc-500\'}`}>{l}</button>\n              ))}\n            </div>\n          </div>\n\n          {/* Weight summary */}\n          <div className="px-4 py-4 border-b border-zinc-800 space-y-2">\n            <WCard label="BASE GEAR"  icon={<Package size={11}/>} data={fmt(stats.base)}       accent="text-orange-400"/>\n            <WCard label="CONSUMABLE" icon={<Flame size={11}/>}   data={fmt(consumable.total)}  accent="text-cyan-400"/>\n            <WCard label="TOTAL"      icon={<Scale size={11}/>}   data={fmt(totalG)}            highlight/>\n            {stats.missing > 0 && (\n              <div className="flex items-center gap-1.5 px-2 py-1.5 rounded-lg bg-amber-950/50 border border-amber-900/40">\n                <AlertCircle size={10} className="text-amber-400 flex-shrink-0"/>\n                <span className="text-[10px] text-amber-300">{stats.missing} item{stats.missing>1?\'s\':\'\'} missing weight</span>\n              </div>\n            )}\n          </div>\n\n          {/* Distribution */}\n          <div className="px-4 py-3 border-b border-zinc-800">\n            <div className="text-[9px] tracking-[.18em] text-zinc-600 mb-2">BREAKDOWN</div>\n            <DistBar byCat={stats.byCat} total={stats.base}/>\n          </div>\n\n          {/* Nav links */}\n          <nav className="px-3 py-3 space-y-1 flex-1">\n            {NAV.map(([id,label,icon])=>(\n              <button key={id} onClick={()=>setView(id)}\n                className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold tracking-[.1em] transition-all ${\n                  view===id\n                    ? \'bg-zinc-100 text-zinc-950\'\n                    : \'text-zinc-500 hover:bg-zinc-800 hover:text-zinc-200\'\n                }`}>\n                {icon}{label}\n              </button>\n            ))}\n          </nav>\n\n          <div className="px-4 pb-4 text-[9px] text-zinc-700 tracking-wider">DATA SAVED IN BROWSER</div>\n        </aside>\n\n        {/* Scrollable main */}\n        <main className="flex-1 overflow-y-auto">\n          <div className="max-w-2xl mx-auto px-6 py-6">\n            {mainContent}\n          </div>\n        </main>\n      </div>\n\n      {/* ═══════════════════════════════════════════════\n          MOBILE — compact sticky header + scroll body\n      ═══════════════════════════════════════════════ */}\n      <div className="md:hidden flex flex-col" style={{minHeight:\'100dvh\'}}>\n\n        <header className="sticky top-0 z-40 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-800/80 flex-shrink-0">\n          <div className="px-3 pt-2.5 pb-2">\n\n            {/* Brand row */}\n            <div className="flex items-center justify-between mb-2">\n              <div className="flex items-center gap-1.5">\n                <Mountain size={13} className="text-orange-500" strokeWidth={2.5}/>\n                <span className="text-[10px] tracking-[.2em] font-bold">PACK ANALYST</span>\n              </div>\n              <div className="flex bg-zinc-900 border border-zinc-800 rounded-full p-0.5">\n                {[[\'imperial\',\'OZ\'],[\'metric\',\'G\']].map(([u,l])=>(\n                  <button key={u} onClick={()=>setState(s=>({...s,displayUnit:u}))}\n                    className={`px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider transition-all ${state.displayUnit===u?\'bg-orange-500 text-zinc-950\':\'text-zinc-500\'}`}>{l}</button>\n                ))}\n              </div>\n            </div>\n\n            {/* Weight row */}\n            <div className="grid grid-cols-3 gap-1 mb-1.5">\n              <WCard label="BASE"  icon={<Package size={10}/>} data={fmt(stats.base)}      accent="text-orange-400" compact/>\n              <WCard label="FOOD+" icon={<Flame size={10}/>}   data={fmt(consumable.total)} accent="text-cyan-400"   compact/>\n              <WCard label="TOTAL" icon={<Scale size={10}/>}   data={fmt(totalG)}           highlight compact/>\n            </div>\n\n            <DistBar byCat={stats.byCat} total={stats.base}/>\n\n            {stats.missing > 0 && (\n              <div className="flex items-center gap-1 mt-1 px-2 py-1 rounded-md bg-amber-950/50 border border-amber-900/40">\n                <AlertCircle size={9} className="text-amber-400 flex-shrink-0"/>\n                <span className="text-[9px] text-amber-300">{stats.missing} item{stats.missing>1?\'s\':\'\'} missing weight</span>\n              </div>\n            )}\n\n            {/* Tabs */}\n            <div className="flex gap-1 mt-2">\n              {NAV.map(([id,label])=>(\n                <button key={id} onClick={()=>setView(id)}\n                  className={`flex-1 py-2 rounded-md text-[10px] tracking-[.1em] font-bold transition-all active:scale-[.97] ${view===id?\'bg-zinc-100 text-zinc-950\':\'bg-zinc-800/70 text-zinc-500\'}`}>\n                  {label}\n                </button>\n              ))}\n            </div>\n          </div>\n        </header>\n\n        <main className="flex-1">\n          <div className="px-3 py-4 pb-10">\n            {mainContent}\n          </div>\n        </main>\n      </div>\n\n      {modals}\n      {globalStyle}\n    </div>\n  );\n}\n\n// ─── Weight Card ──────────────────────────────────────────────────────────────\nfunction WCard({label, icon, data, accent, highlight, compact}) {\n  if (compact) return (\n    <div className={`rounded-lg px-2 py-1.5 ${highlight?\'bg-white text-zinc-950\':\'bg-zinc-900 border border-zinc-800\'}`}>\n      <div className={`flex items-center gap-0.5 text-[8px] tracking-[.1em] mb-0.5 ${highlight?\'text-zinc-500\':accent}`}>{icon}{label}</div>\n      <div className={`font-bold tabular-nums leading-none ${highlight?\'text-zinc-950\':accent}`}>\n        <span className="text-[13px]">{data.main}</span>\n        <span className="text-[9px] ml-0.5 font-normal opacity-70">{data.sub}</span>\n      </div>\n    </div>\n  );\n  return (\n    <div className={`rounded-xl px-2.5 py-2 ${highlight?\'bg-white text-zinc-950\':\'bg-zinc-900 border border-zinc-800\'}`}>\n      <div className={`flex items-center gap-1 text-[9px] tracking-[.14em] mb-0.5 ${highlight?\'text-zinc-500\':accent}`}>{icon}{label}</div>\n      <div className={`font-bold tabular-nums leading-none ${highlight?\'text-zinc-950\':accent}`}>\n        <span className="text-[17px]">{data.main}</span>\n        <span className="text-[10px] ml-1 font-normal opacity-70">{data.sub}</span>\n      </div>\n    </div>\n  );\n}\n\n// ─── Dist Bar ─────────────────────────────────────────────────────────────────\nfunction DistBar({byCat, total}) {\n  const entries = Object.entries(byCat).filter(([,g])=>g>0).sort((a,b)=>b[1]-a[1]);\n  if (!total) return <div className="h-1.5 rounded-full bg-zinc-800/60"/>;\n  return (\n    <div>\n      <div className="h-1.5 rounded-full overflow-hidden flex bg-zinc-800/40">\n        {entries.map(([cat,g])=>(\n          <div key={cat} style={{width:`${(g/total)*100}%`,background:CAT_COLOR[cat]}} className="h-full transition-all duration-500"/>\n        ))}\n      </div>\n      <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1.5">\n        {entries.map(([cat,g])=>(\n          <span key={cat} className="flex items-center gap-1 text-[9px] text-zinc-500">\n            <span className="w-1.5 h-1.5 rounded-sm" style={{background:CAT_COLOR[cat]}}/>\n            {cat} <span className="text-zinc-600">{((g/total)*100).toFixed(0)}%</span>\n          </span>\n        ))}\n      </div>\n    </div>\n  );\n}\n\n// ─── Category Filter ──────────────────────────────────────────────────────────\nfunction CatFilter({filterCat, setFilterCat, items}) {\n  const counts = CATEGORIES.reduce((a,c)=>({...a,[c]:items.filter(i=>i.category===c).length}),{});\n  return (\n    <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-3 px-3" style={{scrollbarWidth:\'none\'}}>\n      <Chip active={filterCat===\'All\'} onClick={()=>setFilterCat(\'All\')}>ALL {items.length}</Chip>\n      {CATEGORIES.filter(c=>counts[c]>0).map(c=>(\n        <Chip key={c} active={filterCat===c} onClick={()=>setFilterCat(c)} color={CAT_COLOR[c]}>\n          {c} {counts[c]}\n        </Chip>\n      ))}\n    </div>\n  );\n}\nfunction Chip({active, onClick, color, children}) {\n  return (\n    <button onClick={onClick}\n      className={`flex-shrink-0 flex items-center gap-1 px-2.5 py-1.5 rounded-full text-[10px] font-bold tracking-wide whitespace-nowrap active:scale-95 transition-transform ${active?\'bg-zinc-100 text-zinc-950\':\'bg-zinc-900 text-zinc-400 border border-zinc-800\'}`}>\n      {color && <span className="w-1.5 h-1.5 rounded-full" style={{background:color}}/>}\n      {children}\n    </button>\n  );\n}\n\n// ─── Preset View ──────────────────────────────────────────────────────────────\nfunction PresetView({presets, activePreset, items, filterCat, setFilterCat,\n                     tripSim, consumable, mealPlan, clothingPlan,\n                     onSetActive, onAddPreset, onEditPreset, onDup, onToggle, onQtyChange,\n                     onOpenSim, onOpenFood, onOpenClothing, fmt}) {\n  const sel      = activePreset?.selections || {};\n  const visible  = items.filter(it => filterCat===\'All\' || it.category===filterCat);\n  const grouped  = CATEGORIES.map(cat=>[cat, visible.filter(i=>i.category===cat)]).filter(([,a])=>a.length);\n  const mealCount= mealPlan.meals?.length || 0;\n  const fuelInfo = calcFuel(tripSim);\n\n  return (\n    <div>\n      {/* Loadout strip */}\n      <div className="mb-4">\n        <div className="flex items-center justify-between mb-2">\n          <span className="text-[10px] tracking-[.2em] text-zinc-500">LOADOUTS</span>\n          <button onClick={onAddPreset} className="flex items-center gap-1 text-[10px] text-orange-400 font-bold py-1 px-1.5 -mr-1.5 active:opacity-70">\n            <Plus size={12} strokeWidth={3}/> NEW\n          </button>\n        </div>\n        <div className="flex gap-2 overflow-x-auto pb-1.5 -mx-3 px-3" style={{scrollbarWidth:\'none\'}}>\n          {presets.map(p=>(\n            <button key={p.id} onClick={()=>onSetActive(p.id)}\n              className={`flex-shrink-0 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all active:scale-95 ${\n                activePreset?.id===p.id ? \'bg-orange-500 text-zinc-950 shadow-lg shadow-orange-500/25\' : \'bg-zinc-900 text-zinc-300 border border-zinc-800\'\n              }`}>\n              {p.name}\n              <span className={`ml-1.5 text-[10px] font-normal ${activePreset?.id===p.id?\'text-orange-950/70\':\'text-zinc-600\'}`}>\n                {Object.keys(p.selections).length}\n              </span>\n            </button>\n          ))}\n        </div>\n        {activePreset && (\n          <div className="flex gap-4 mt-1.5">\n            <button onClick={()=>onEditPreset(activePreset)} className="text-[10px] text-zinc-600 active:text-zinc-300">✎ RENAME</button>\n            <button onClick={()=>onDup(activePreset.id)} className="text-[10px] text-zinc-600 active:text-zinc-300">⎘ DUPLICATE</button>\n          </div>\n        )}\n      </div>\n\n      {/* Sim cards — stacked icon + label, works at any screen width */}\n      <div className="grid grid-cols-3 gap-2 mb-4">\n        {/* Trip Sim */}\n        <button onClick={onOpenSim}\n          className="flex flex-col items-center gap-1.5 py-3 px-1 rounded-xl bg-zinc-900 border border-zinc-800 active:bg-zinc-800 transition-colors">\n          <div className="w-9 h-9 rounded-xl bg-cyan-950/60 border border-cyan-900/40 flex items-center justify-center">\n            <FlaskConical size={16} className="text-cyan-400"/>\n          </div>\n          <div className="text-center w-full">\n            <div className="text-[11px] font-bold text-cyan-300 leading-tight">Trip Sim</div>\n            <div className="text-[10px] text-zinc-600 leading-tight">{tripSim.days}d · {tripSim.groupSize}pax</div>\n            {!fuelInfo.sufficient && <div className="text-[9px] text-amber-400 font-bold">⚠ fuel</div>}\n          </div>\n        </button>\n\n        {/* Food Plan */}\n        <button onClick={onOpenFood}\n          className="flex flex-col items-center gap-1.5 py-3 px-1 rounded-xl bg-zinc-900 border border-zinc-800 active:bg-zinc-800 transition-colors">\n          <div className="w-9 h-9 rounded-xl bg-orange-950/60 border border-orange-900/40 flex items-center justify-center">\n            <UtensilsCrossed size={16} className="text-orange-400"/>\n          </div>\n          <div className="text-center w-full">\n            <div className="text-[11px] font-bold text-orange-300 leading-tight">Food</div>\n            <div className="text-[10px] text-zinc-600 leading-tight">\n              {tripSim.foodWeightOz > 0 ? `${tripSim.foodWeightOz}oz` : mealCount > 0 ? `${mealCount} meals` : \'not set\'}\n            </div>\n          </div>\n        </button>\n\n        {/* Clothing */}\n        <button onClick={onOpenClothing}\n          className="flex flex-col items-center gap-1.5 py-3 px-1 rounded-xl bg-zinc-900 border border-zinc-800 active:bg-zinc-800 transition-colors">\n          <div className="w-9 h-9 rounded-xl bg-emerald-950/60 border border-emerald-900/40 flex items-center justify-center text-lg leading-none">\n            👕\n          </div>\n          <div className="text-center w-full">\n            <div className="text-[11px] font-bold text-emerald-300 leading-tight">Clothing</div>\n            <div className="text-[10px] text-zinc-600 leading-tight">\n              {(()=>{const n=Object.values(clothingPlan.items||{}).filter(i=>i.selected).length+(clothingPlan.customItems||[]).filter(i=>i.selected).length;return n+\' item\'+(n!==1?\'s\':\'\');})()}\n            </div>\n          </div>\n        </button>\n      </div>\n\n      <CatFilter filterCat={filterCat} setFilterCat={setFilterCat} items={items}/>\n\n      <div className="mt-4 space-y-5">\n        {grouped.length===0 && (\n          <div className="text-center py-16 text-zinc-600 text-sm">\n            No gear yet — tap <span className="text-orange-400 font-bold">LIBRARY</span> to add items.\n          </div>\n        )}\n        {grouped.map(([cat,arr])=>(\n          <section key={cat}>\n            <div className="flex items-center gap-2 mb-2">\n              <span className="w-1.5 h-1.5 rounded-full" style={{background:CAT_COLOR[cat]}}/>\n              <span className="text-[10px] tracking-[.2em] font-bold text-zinc-400">{cat.toUpperCase()}</span>\n              <div className="flex-1 h-px bg-zinc-800"/>\n              <span className="text-[10px] text-zinc-600 tabular-nums">{arr.filter(i=>sel[i.id]).length}/{arr.length}</span>\n            </div>\n            <div className="space-y-1.5">\n              {arr.map(it=>(\n                <ToggleRow key={it.id} item={it} selVal={sel[it.id]} selected={!!sel[it.id]} onToggle={()=>onToggle(it.id)} onQtyChange={qty=>onQtyChange(it.id,qty)} fmt={fmt}/>\n              ))}\n            </div>\n          </section>\n        ))}\n      </div>\n    </div>\n  );\n}\n\nfunction ToggleRow({item, selVal, selected, onToggle, onQtyChange, fmt}) {\n  // selVal is {selected,qty} object or undefined; item.qty is the default from library\n  const qty     = (selVal && typeof selVal===\'object\') ? Math.max(1,parseInt(selVal.qty)||1) : Math.max(1,parseInt(item.qty)||1);\n  const gEach   = toGrams(item.weight, item.unit);\n  const gTotal  = gEach * qty;\n  const display = (item.weight==null || item.weight===\'\') ? null : fmt(gTotal);\n  const hasMulti = (item.qty||1) > 1;\n\n  return (\n    <div className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition-all ${selected?\'bg-zinc-50 text-zinc-950\':\'bg-zinc-900 border border-zinc-800 text-zinc-200\'}`}>\n      {/* Checkbox */}\n      <button onClick={onToggle}\n        className={`w-6 h-6 rounded-md border-2 flex-shrink-0 flex items-center justify-center ${selected?\'bg-orange-500 border-orange-500\':\'border-zinc-700\'}`}>\n        {selected && <Check size={14} className="text-zinc-950" strokeWidth={3.5}/>}\n      </button>\n\n      {/* Name + brand */}\n      <button onClick={onToggle} className="flex-1 min-w-0 text-left">\n        <div className="text-sm font-bold truncate leading-snug">{item.name}</div>\n        <div className={`text-[10px] truncate ${selected?\'text-zinc-500\':\'text-zinc-600\'}`}>\n          {[item.brand, item.details].filter(Boolean).join(\' · \') || \'—\'}\n        </div>\n      </button>\n\n      {/* Qty stepper — only show if item has qty > 1 in library OR is selected */}\n      {selected && qty >= 1 && (\n        <div className="flex items-center gap-1 flex-shrink-0">\n          <button onClick={e=>{e.stopPropagation();onQtyChange(Math.max(1,qty-1));}}\n            className={`w-6 h-6 rounded-md text-sm font-bold flex items-center justify-center ${selected?\'bg-zinc-200 text-zinc-800 active:bg-zinc-300\':\'bg-zinc-800 text-zinc-300 active:bg-zinc-700\'}`}>−</button>\n          <div className={`w-5 text-center text-xs font-bold tabular-nums ${selected?\'text-zinc-800\':\'text-zinc-400\'}`}>{qty}</div>\n          <button onClick={e=>{e.stopPropagation();onQtyChange(Math.min(20,qty+1));}}\n            className={`w-6 h-6 rounded-md text-sm font-bold flex items-center justify-center ${selected?\'bg-zinc-200 text-zinc-800 active:bg-zinc-300\':\'bg-zinc-800 text-zinc-300 active:bg-zinc-700\'}`}>+</button>\n        </div>\n      )}\n\n      {/* Weight — big total, small unit + qty note below */}\n      <div className="text-right flex-shrink-0 min-w-[48px]">\n        {!display\n          ? <span className="text-[11px] font-bold text-amber-500">NO WT</span>\n          : <>\n              <div className="text-sm font-bold tabular-nums leading-tight">{display.main}</div>\n              <div className={`text-[9px] leading-tight ${selected?\'text-zinc-500\':\'text-zinc-700\'}`}>{display.sub}</div>\n              {qty > 1 && <div className={`text-[9px] tabular-nums ${selected?\'text-zinc-500\':\'text-zinc-700\'}`}>×{qty} total</div>}\n            </>}\n      </div>\n    </div>\n  );\n}\n\n\n// ─── AI food weight estimator ─────────────────────────────────────────────────\nasync function aiFoodEstimate(days, groupSize, mealStyle) {\n  const system = `You are a backpacking nutrition expert. Estimate the total food weight for a trip.\nRespond ONLY with valid JSON (no markdown, no backticks):\n{"weight_oz_per_person_per_day":number,"note":string,"breakdown":string}\nRules:\n- weight_oz_per_person_per_day: typical total dry food weight in oz. Ultralight=14-16oz, standard=18-22oz, comfort=24-28oz.\n- note: ≤12 words explaining the estimate.\n- breakdown: ≤20 words describing what\'s included.`;\n\n  const res = await fetch(\'https://api.anthropic.com/v1/messages\', {\n    method:\'POST\', headers:{\'Content-Type\':\'application/json\'},\n    body: JSON.stringify({\n      model:AI_MODEL, max_tokens:200, system,\n      messages:[{role:\'user\', content:`Trip: ${days} days, ${groupSize} people, style: ${mealStyle}`}],\n    }),\n  });\n  if (!res.ok) throw new Error(`API ${res.status}`);\n  const data = await res.json();\n  const text = (data.content||[]).filter(b=>b.type===\'text\').map(b=>b.text).join(\'\\n\');\n  const m = text.match(/\\{[\\s\\S]*?\\}/);\n  if (!m) throw new Error(\'No JSON\');\n  return JSON.parse(m[0]);\n}\n\n// ─── StepRow ─────────────────────────────────────────────────────────────────\nfunction StepRow({label, sub, val, min=0, max=999, step=1, unit=\'\', onChange}) {\n  return (\n    <div className="flex items-center gap-3 py-3 border-b border-zinc-800/60 last:border-0">\n      <div className="flex-1 min-w-0">\n        <div className="text-sm font-bold">{label}</div>\n        {sub && <div className="text-[10px] text-zinc-500 mt-0.5 leading-relaxed">{sub}</div>}\n      </div>\n      <div className="flex items-center gap-2 flex-shrink-0">\n        <button onClick={()=>onChange(Math.max(min, parseFloat((val-step).toFixed(2))))}\n          className="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-200 text-xl font-bold flex items-center justify-center active:bg-zinc-700">−</button>\n        <div className="w-16 text-center font-bold tabular-nums text-sm">{val}{unit}</div>\n        <button onClick={()=>onChange(Math.min(max, parseFloat((val+step).toFixed(2))))}\n          className="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-200 text-xl font-bold flex items-center justify-center active:bg-zinc-700">+</button>\n      </div>\n    </div>\n  );\n}\n\n// ─── Trip + Fuel Simulator (unified modal) ────────────────────────────────────\nfunction TripSimModal({tripSim, mealPlan, consumable, onChangeSim, fmt, onClose}) {\n  const formRef = useRef({...DEFAULT_TRIP, ...tripSim});\n  const [form, setForm] = useState({...DEFAULT_TRIP, ...tripSim});\n  const [foodEstimating, setFoodEstimating] = useState(false);\n  const [foodEstimate,   setFoodEstimate]   = useState(null);\n  const [mealStyle,      setMealStyle]      = useState(\'standard\');\n  const set = p => setForm(f => { const next = {...f, ...p}; formRef.current = next; return next; });\n\n  const fuel      = calcFuel(form);\n  const waterG    = (parseFloat(form.maxWaterL)||0) * 1000 * (form.groupSize||1);\n  const foodG     = (parseFloat(form.foodWeightOz)||0) * 28.3495 * (form.groupSize||1);\n  const totalG    = waterG + fuel.totalStartG + foodG;\n  const isCustom  = form.canisterId === \'custom\';\n\n  // Save on close — avoids any re-render loop\n  const handleClose = () => { onChangeSim(formRef.current); onClose(); };\n\n  const estimateFood = async () => {\n    setFoodEstimating(true); setFoodEstimate(null);\n    try {\n      const r = await aiFoodEstimate(form.days, form.groupSize, mealStyle);\n      setFoodEstimate(r);\n    } catch { setFoodEstimate({note:\'Estimate failed\', breakdown:\'\', weight_oz_per_person_per_day:0}); }\n    finally { setFoodEstimating(false); }\n  };\n\n  const applyFoodEstimate = () => {\n    if (!foodEstimate) return;\n    const totalOzPerPerson = foodEstimate.weight_oz_per_person_per_day * form.days;\n    set({foodWeightOz: parseFloat(totalOzPerPerson.toFixed(1))});\n    setFoodEstimate(null);\n  };\n\n\n\n  // StepRow defined at module level below\n\n  return (\n    <Modal title="Trip Simulator" onClose={handleClose}>\n      <div className="space-y-0">\n\n        {/* ── Trip basics ── */}\n        <SectionLabel>TRIP</SectionLabel>\n        <StepRow label="Days" val={form.days} min={1} max={30}\n          onChange={v=>set({days:v})} unit={form.days>1?\' days\':\' day\'}/>\n        <StepRow label="Group Size" val={form.groupSize} min={1} max={20}\n          onChange={v=>set({groupSize:v})} unit={form.groupSize>1?\' people\':\' person\'}/>\n\n        {/* ── Water ── */}\n        <SectionLabel>WATER</SectionLabel>\n        <StepRow\n          label="Max water I\'ll carry"\n          sub="The most you\'ll have at one time. Starts heavy, gets lighter as you drink and refill."\n          val={form.maxWaterL} min={0.5} max={12} step={0.5}\n          onChange={v=>set({maxWaterL:v})} unit="L"/>\n        <div className="flex items-center justify-between py-2 px-1 text-[10px] text-zinc-600">\n          <span>= {((form.maxWaterL||0)*1000*(form.groupSize||1)/28.3495).toFixed(1)} oz starting · {((form.maxWaterL||0)*(form.groupSize||1)).toFixed(1)}kg</span>\n        </div>\n\n        {/* ── Food ── */}\n        <SectionLabel>FOOD</SectionLabel>\n        <div className="py-3 border-b border-zinc-800/60">\n          <div className="text-sm font-bold mb-1">Total food weight per person</div>\n          <div className="text-[10px] text-zinc-500 mb-3">The full weight of all food you\'re starting with. Only goes down as you eat.</div>\n          <div className="flex gap-2 items-center">\n            <input type="number" min="0" step="0.5" inputMode="decimal"\n              value={form.foodWeightOz||\'\'} onChange={e=>set({foodWeightOz:parseFloat(e.target.value)||0})}\n              placeholder="oz"\n              className="inp tabular-nums flex-1"/>\n            <span className="text-xs text-zinc-500 flex-shrink-0">oz per person</span>\n          </div>\n          {form.foodWeightOz > 0 && (\n            <div className="text-[10px] text-zinc-600 mt-1.5 px-1">\n              = {((form.foodWeightOz||0)*28.3495/1000).toFixed(2)}kg · {((form.foodWeightOz||0)*(form.groupSize||1)).toFixed(1)} oz total for group\n            </div>\n          )}\n        </div>\n\n        {/* AI food estimator */}\n        <div className="py-3 border-b border-zinc-800/60">\n          <div className="text-[10px] text-zinc-500 mb-2 tracking-wider">AI FOOD WEIGHT ESTIMATE</div>\n          <div className="flex gap-1.5 mb-2">\n            {[[\'ultralight\',\'Ultralight\'],[\'standard\',\'Standard\'],[\'comfort\',\'Comfort\']].map(([v,l])=>(\n              <button key={v} onClick={()=>setMealStyle(v)}\n                className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold transition-all active:scale-95 ${mealStyle===v?\'bg-orange-500 text-zinc-950\':\'bg-zinc-800 text-zinc-400\'}`}>\n                {l}\n              </button>\n            ))}\n          </div>\n          <div className="text-[10px] text-zinc-600 mb-2">\n            {mealStyle===\'ultralight\'&&\'~14–16 oz/person/day · freeze-dried, minimal\'}\n            {mealStyle===\'standard\'&&\'~18–22 oz/person/day · mix of real & packaged food\'}\n            {mealStyle===\'comfort\'&&\'~24–28 oz/person/day · heavier real food, snacks\'}\n          </div>\n          <button onClick={estimateFood} disabled={foodEstimating}\n            className={`w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-xs font-bold tracking-wider ${\n              foodEstimating ? \'bg-zinc-800 text-zinc-500\'\n              : \'bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white active:opacity-80\'\n            }`}>\n            {foodEstimating\n              ? <><span className="w-3 h-3 border-2 border-zinc-500 border-t-zinc-200 rounded-full spin"/> <span className="pulse">ESTIMATING…</span></>\n              : <><Sparkles size={13}/> ESTIMATE FOOD WEIGHT</>}\n          </button>\n\n          {foodEstimate && !foodEstimating && (\n            <div className="mt-2 p-3 rounded-xl bg-violet-950/40 border border-violet-900/40">\n              <div className="text-xs text-violet-200 font-bold mb-0.5">\n                ~{foodEstimate.weight_oz_per_person_per_day?.toFixed(1)} oz/person/day\n                → {(foodEstimate.weight_oz_per_person_per_day * form.days).toFixed(1)} oz total\n              </div>\n              <div className="text-[10px] text-violet-300/70 mb-2">{foodEstimate.note} · {foodEstimate.breakdown}</div>\n              <button onClick={applyFoodEstimate}\n                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-violet-500/20 border border-violet-500/40 text-violet-200 text-[11px] font-bold active:bg-violet-500/30">\n                <RefreshCw size={11}/> USE THIS ESTIMATE\n              </button>\n            </div>\n          )}\n        </div>\n\n        {/* ── Fuel ── */}\n        <SectionLabel>FUEL CANISTER</SectionLabel>\n        <div className="py-3 border-b border-zinc-800/60">\n          <div className="text-[10px] text-zinc-500 mb-2 tracking-wider">CANISTER SIZE</div>\n          <div className="grid grid-cols-2 gap-1.5">\n            {CANISTERS.map(c=>(\n              <button key={c.id} onClick={()=>set({canisterId:c.id})}\n                className={`px-3 py-2 rounded-lg text-xs font-bold text-left transition-all active:scale-95 ${form.canisterId===c.id?\'bg-orange-500 text-zinc-950\':\'bg-zinc-800 text-zinc-400\'}`}>\n                {c.label}\n                {c.id!==\'custom\' && (\n                  <span className={`block text-[10px] font-normal mt-0.5 ${form.canisterId===c.id?\'text-orange-950/70\':\'text-zinc-600\'}`}>\n                    {c.totalG}g full · {c.canisterG}g empty\n                  </span>\n                )}\n              </button>\n            ))}\n          </div>\n        </div>\n\n        {isCustom && (\n          <div className="py-3 border-b border-zinc-800/60 space-y-2">\n            <div className="grid grid-cols-2 gap-2">\n              <Field label="Fuel Content (g)">\n                <input type="number" min="0" value={form.customFuelG||\'\'} onChange={e=>set({customFuelG:+e.target.value})}\n                  className="inp tabular-nums" inputMode="numeric" placeholder="100"/>\n              </Field>\n              <Field label="Canister Weight (g)">\n                <input type="number" min="0" value={form.customCanisterG||\'\'} onChange={e=>set({customCanisterG:+e.target.value})}\n                  className="inp tabular-nums" inputMode="numeric" placeholder="93"/>\n              </Field>\n            </div>\n          </div>\n        )}\n\n        <StepRow label="Number of Canisters" val={form.canisterQty} min={1} max={10} onChange={v=>set({canisterQty:v})}/>\n\n        {/* Fuel sufficiency */}\n        <div className={`mt-2 p-3 rounded-xl border ${fuel.sufficient?\'bg-emerald-950/30 border-emerald-900/40\':\'bg-amber-950/30 border-amber-900/40\'}`}>\n          <div className="flex items-start gap-2 text-xs">\n            <span>{fuel.sufficient?\'✓\':\'⚠\'}</span>\n            <div>\n              <div className={`font-bold ${fuel.sufficient?\'text-emerald-300\':\'text-amber-300\'}`}>\n                {fuel.sufficient?\'Fuel sufficient\':\'May run short\'}\n              </div>\n              <div className="text-zinc-500 mt-0.5">\n                Need ~{Math.round(fuel.neededFuelG)}g · Have {Math.round(fuel.availFuelG)}g · Canister weight: {fmt(fmtImp(fuel.totalStartG)).main} {fmtImp(fuel.totalStartG).sub}\n              </div>\n            </div>\n          </div>\n        </div>\n\n        {/* ── Summary ── */}\n        <SectionLabel>CONSUMABLE TOTAL</SectionLabel>\n        <div className="grid grid-cols-3 gap-2 mt-2">\n          {[\n            [\'Water\', waterG,           \'text-blue-400\'],\n            [\'Fuel\',  fuel.totalStartG, \'text-orange-400\'],\n            [\'Food\',  foodG,            \'text-green-400\'],\n          ].map(([l,g,c])=>{\n            const d = fmtImp(g);\n            return (\n              <div key={l} className="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-center">\n                <div className={`text-[9px] tracking-wider mb-1 ${c}`}>{l.toUpperCase()}</div>\n                <div className={`text-sm font-bold tabular-nums ${c}`}>{d.main}</div>\n                <div className="text-[9px] text-zinc-600">{d.sub}</div>\n              </div>\n            );\n          })}\n        </div>\n        <div className="flex items-center justify-between mt-3 mb-4 px-1">\n          <span className="text-xs text-zinc-500">Starting consumable weight</span>\n          <span className="text-sm font-bold tabular-nums">\n            {fmtImp(totalG).main} <span className="text-xs text-zinc-500 font-normal">{fmtImp(totalG).sub}</span>\n          </span>\n        </div>\n\n        <button onClick={handleClose}\n          className="w-full py-3.5 rounded-xl bg-cyan-500 text-zinc-950 text-xs font-bold tracking-wider active:bg-cyan-400">\n          DONE · SAVE\n        </button>\n      </div>\n    </Modal>\n  );\n}\n\n// ─── Food Plan Modal (read-only — meals logged externally, weight set in Trip Sim) ──\nfunction FoodPlanModal({mealPlan, tripSim, onChange, onClose}) {\n  const meals = mealPlan.meals || [];\n  const days  = tripSim.days || 1;\n  const pax   = tripSim.groupSize || 1;\n\n  const totalsPerDay = meals.reduce((t,m)=>({\n    weightOz: t.weightOz+(parseFloat(m.weightOz)||0),\n    calories: t.calories+(parseFloat(m.calories)||0),\n    protein:  t.protein +(parseFloat(m.protein)||0),\n    carbs:    t.carbs   +(parseFloat(m.carbs)||0),\n    fat:      t.fat     +(parseFloat(m.fat)||0),\n  }), {weightOz:0, calories:0, protein:0, carbs:0, fat:0});\n\n  const tripOzPerPerson = totalsPerDay.weightOz * days;\n  const tripOzTotal     = tripOzPerPerson * pax;\n  const MEAL_CATS = [\'Breakfast\',\'Lunch\',\'Dinner\',\'Snack\',\'Drink\'];\n  const catColor  = {Breakfast:\'#f97316\', Lunch:\'#06b6d4\', Dinner:\'#8b5cf6\', Snack:\'#10b981\', Drink:\'#3b82f6\'};\n\n  return (\n    <Modal title="Food Plan" onClose={onClose}>\n      <div className="space-y-3">\n        <p className="text-[11px] text-zinc-500 leading-relaxed">\n          Meal log. Set total food weight in Trip Sim → Food section.\n        </p>\n\n        {meals.length > 0 ? (\n          <>\n            <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-3">\n              <div className="text-[10px] tracking-wider text-zinc-500 mb-2">PER PERSON · PER DAY</div>\n              <div className="grid grid-cols-4 gap-2 text-center mb-3">\n                {[\n                  [\'CAL\',  totalsPerDay.calories,        \'text-orange-400\'],\n                  [\'PRO\',  totalsPerDay.protein+\'g\',      \'text-cyan-400\'],\n                  [\'CARB\', totalsPerDay.carbs+\'g\',        \'text-violet-400\'],\n                  [\'FAT\',  totalsPerDay.fat+\'g\',          \'text-emerald-400\'],\n                ].map(([l,v,c])=>(\n                  <div key={l}>\n                    <div className={`text-[9px] tracking-wider ${c}`}>{l}</div>\n                    <div className="text-sm font-bold tabular-nums mt-0.5">{v}</div>\n                  </div>\n                ))}\n              </div>\n              <div className="pt-2 border-t border-zinc-800 space-y-1">\n                <div className="flex items-center justify-between text-[10px]">\n                  <span className="text-zinc-500">Per person · {days}d</span>\n                  <span className="font-bold text-orange-300">{tripOzPerPerson.toFixed(1)} oz</span>\n                </div>\n                <div className="flex items-center justify-between text-[10px]">\n                  <span className="text-zinc-500">Total · {pax} {pax>1?\'people\':\'person\'}</span>\n                  <span className="font-bold text-white">{tripOzTotal.toFixed(1)} oz</span>\n                </div>\n              </div>\n            </div>\n\n            {MEAL_CATS.map(cat => {\n              const catMeals = meals.map((m,i)=>({...m,_i:i})).filter(m=>m.category===cat);\n              if (!catMeals.length) return null;\n              return (\n                <div key={cat}>\n                  <div className="flex items-center gap-2 mb-1.5">\n                    <span className="w-1.5 h-1.5 rounded-full" style={{background:catColor[cat]}}/>\n                    <span className="text-[10px] tracking-wider text-zinc-500">{cat.toUpperCase()}</span>\n                    <div className="flex-1 h-px bg-zinc-800/60"/>\n                  </div>\n                  {catMeals.map(m=>(\n                    <div key={m.id} className="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 mb-1.5">\n                      <div className="flex-1 min-w-0">\n                        <div className="text-sm font-bold truncate">{m.name||\'Unnamed\'}</div>\n                        <div className="text-[10px] text-zinc-600">{m.calories} cal · {m.protein}g P · {m.weightOz} oz</div>\n                      </div>\n                      <button onClick={()=>onChange({meals:meals.filter((_,i)=>i!==m._i)})}\n                        className="p-1.5 text-zinc-600 active:text-red-400"><Trash2 size={14}/></button>\n                    </div>\n                  ))}\n                </div>\n              );\n            })}\n          </>\n        ) : (\n          <div className="text-center py-10 text-zinc-600 text-sm leading-relaxed">\n            No meals logged yet.<br/>\n            <span className="text-[11px]">Set food weight in Trip Sim to track consumable weight.</span>\n          </div>\n        )}\n\n        <button onClick={onClose}\n          className="w-full py-3.5 rounded-xl bg-orange-500 text-zinc-950 text-xs font-bold tracking-wider active:bg-orange-400">\n          DONE\n        </button>\n      </div>\n    </Modal>\n  );\n}\n\n// ─── Clothing Modal ────────────────────────────────────────────────────────────\nconst CLOTHING_CATS = [\'Upper\',\'Lower\',\'Feet\',\'Head\',\'Hands\'];\nconst CLOTHING_CAT_COLOR = { Upper:\'#f97316\', Lower:\'#8b5cf6\', Feet:\'#06b6d4\', Head:\'#eab308\', Hands:\'#10b981\' };\n\nfunction ClothingModal({clothingPlan, onChange, onClose, fmt}) {\n  const initItems = clothingPlan.items || {};\n  const initCustom = clothingPlan.customItems || [];\n\n  const [localItems, setLocalItems] = useState(() => {\n    const init = {};\n    CLOTHING_ITEMS.forEach(ci => {\n      init[ci.id] = { selected:false, qty:1, weightOz:ci.defaultOz, name:\'\', ...initItems[ci.id] };\n    });\n    return init;\n  });\n\n  // Custom items now have a category so they appear in the right section\n  const [localCustom, setLocalCustom] = useState(() => initCustom.map(c => ({...c})));\n\n  // Per-category "add" form state\n  const [addingCat, setAddingCat] = useState(null); // which category is open\n  const [customForm, setCustomForm] = useState({label:\'\', weightOz:\'\'});\n\n  const setItem = useCallback((id, patch) => setLocalItems(prev => ({...prev, [id]:{...prev[id],...patch}})), []);\n  const setCustom = useCallback((idx, patch) => setLocalCustom(prev => prev.map((c,i) => i===idx ? {...c,...patch} : c)), []);\n\n  const totalG = useMemo(() => {\n    let g = 0;\n    CLOTHING_ITEMS.forEach(ci => {\n      const s = localItems[ci.id];\n      if (!s?.selected) return;\n      g += (parseFloat(s.weightOz)||0) * 28.3495 * Math.max(1, parseInt(s.qty)||1);\n    });\n    localCustom.forEach(ci => {\n      if (!ci.selected) return;\n      g += (parseFloat(ci.weightOz)||0) * 28.3495 * Math.max(1, parseInt(ci.qty)||1);\n    });\n    return g;\n  }, [localItems, localCustom]);\n\n  const selectedCount = useMemo(() =>\n    Object.values(localItems).filter(i => i.selected).length +\n    localCustom.filter(i => i.selected).length,\n    [localItems, localCustom]\n  );\n\n  const startAdd = (cat) => { setAddingCat(cat); setCustomForm({label:\'\', weightOz:\'\'}); };\n  const cancelAdd = () => { setAddingCat(null); setCustomForm({label:\'\', weightOz:\'\'}); };\n  const confirmAdd = (cat) => {\n    if (!customForm.label.trim()) return;\n    setLocalCustom(prev => [...prev, {\n      id: uid(), label: customForm.label.trim(), category: cat,\n      weightOz: parseFloat(customForm.weightOz) || 2.0,\n      qty: 1, selected: true,\n    }]);\n    cancelAdd();\n  };\n\n  const save = () => { onChange({ items: localItems, customItems: localCustom }); onClose(); };\n\n  return (\n    <Modal title="Clothing" onClose={onClose}>\n      <div className="space-y-0">\n\n        {/* Summary */}\n        <div className="flex items-center justify-between mb-4 p-3 rounded-xl bg-zinc-800/60 border border-zinc-800">\n          <div>\n            <div className="text-[10px] tracking-wider text-zinc-500">SELECTED</div>\n            <div className="text-sm font-bold mt-0.5">{selectedCount} item{selectedCount!==1?\'s\':\'\'}</div>\n          </div>\n          <div className="text-right">\n            <div className="text-[10px] tracking-wider text-zinc-500">CLOTHING WEIGHT</div>\n            <div className="text-sm font-bold text-orange-400 mt-0.5">\n              {fmt(totalG).main} <span className="text-xs font-normal text-zinc-500">{fmt(totalG).sub}</span>\n            </div>\n          </div>\n        </div>\n\n        {/* Per-category sections */}\n        {CLOTHING_CATS.map(cat => {\n          const catItems   = CLOTHING_ITEMS.filter(ci => ci.category === cat);\n          const catCustom  = localCustom.map((c,i) => ({...c, _idx:i})).filter(c => c.category === cat);\n          const isAdding   = addingCat === cat;\n\n          return (\n            <div key={cat}>\n              <SectionLabel>\n                <span style={{color: CLOTHING_CAT_COLOR[cat]}}>{cat.toUpperCase()}</span>\n              </SectionLabel>\n\n              <div className="space-y-1.5 mb-1">\n                {/* Standard items for this category */}\n                {catItems.map(ci => {\n                  const s = localItems[ci.id];\n                  const totalItemG = (parseFloat(s.weightOz)||0) * 28.3495 * Math.max(1, parseInt(s.qty)||1);\n                  return (\n                    <ClothingRow\n                      key={ci.id}\n                      icon={ci.icon} label={ci.label}\n                      selected={s.selected} weightOz={s.weightOz ?? ci.defaultOz}\n                      qty={s.qty ?? 1} customName={s.name||\'\'}\n                      defaultOz={ci.defaultOz} totalG={totalItemG} fmt={fmt}\n                      onToggle={() => setItem(ci.id, {selected: !s.selected})}\n                      onWeightChange={v => setItem(ci.id, {weightOz: v})}\n                      onQtyChange={v => setItem(ci.id, {qty: v})}\n                      onNameChange={v => setItem(ci.id, {name: v})}\n                    />\n                  );\n                })}\n\n                {/* Custom items for this category */}\n                {catCustom.map(ci => {\n                  const totalItemG = (parseFloat(ci.weightOz)||0) * 28.3495 * Math.max(1, parseInt(ci.qty)||1);\n                  return (\n                    <ClothingRow\n                      key={ci.id}\n                      icon="✦" label={ci.label}\n                      selected={ci.selected} weightOz={ci.weightOz}\n                      qty={ci.qty ?? 1} customName=""\n                      defaultOz={ci.weightOz} totalG={totalItemG} fmt={fmt}\n                      custom\n                      onToggle={() => setCustom(ci._idx, {selected: !ci.selected})}\n                      onWeightChange={v => setCustom(ci._idx, {weightOz: v})}\n                      onQtyChange={v => setCustom(ci._idx, {qty: v})}\n                      onNameChange={() => {}}\n                      onDelete={() => setLocalCustom(prev => prev.filter((_,i) => i !== ci._idx))}\n                    />\n                  );\n                })}\n              </div>\n\n              {/* Add custom item to this category */}\n              {isAdding ? (\n                <div className="p-3 rounded-xl bg-zinc-800/50 border border-zinc-700 space-y-2 mb-2">\n                  <Field label="Item name">\n                    <input value={customForm.label} onChange={e => setCustomForm(f=>({...f,label:e.target.value}))}\n                      placeholder={`e.g., My ${cat} layer`} className="inp" autoFocus/>\n                  </Field>\n                  <Field label="Weight (oz)">\n                    <input type="number" min="0" step="0.1" inputMode="decimal"\n                      value={customForm.weightOz} onChange={e => setCustomForm(f=>({...f,weightOz:e.target.value}))}\n                      placeholder="e.g., 5.5" className="inp tabular-nums"/>\n                  </Field>\n                  <div className="flex gap-2">\n                    <button onClick={cancelAdd}\n                      className="flex-1 py-2.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold">CANCEL</button>\n                    <button onClick={() => confirmAdd(cat)} disabled={!customForm.label.trim()}\n                      className="flex-1 py-2.5 rounded-xl bg-orange-500 text-zinc-950 text-xs font-bold disabled:opacity-40">ADD</button>\n                  </div>\n                </div>\n              ) : (\n                <button onClick={() => startAdd(cat)}\n                  className="w-full flex items-center gap-1.5 py-2 px-3 rounded-lg text-zinc-600 text-[11px] font-bold active:text-zinc-400 mb-1">\n                  <Plus size={11} strokeWidth={3}/> Add item to {cat.toLowerCase()}\n                </button>\n              )}\n            </div>\n          );\n        })}\n\n        <button onClick={save}\n          className="w-full py-3.5 rounded-xl bg-emerald-500 text-zinc-950 text-xs font-bold tracking-wider active:bg-emerald-400 mt-2">\n          SAVE CLOTHING\n        </button>\n      </div>\n    </Modal>\n  );\n}\n\n// ClothingRow — clean separation: checkbox/label = toggle only, weight button = editor only\nfunction ClothingRow({icon, label, selected, weightOz, qty, customName, defaultOz, totalG, fmt,\n                      custom, onToggle, onWeightChange, onQtyChange, onNameChange, onDelete}) {\n  // editingWeight is ONLY set true by tapping the weight display button\n  // It is NEVER set by onToggle, so checking the box never opens the editor\n  const [editingWeight, setEditingWeight] = useState(false);\n  const [localWeight,   setLocalWeight]   = useState(String(weightOz ?? defaultOz));\n  const qtyN       = Math.max(1, parseInt(qty)||1);\n  const isModified  = Math.abs((parseFloat(weightOz)||0) - (parseFloat(defaultOz)||0)) > 0.05;\n\n  // Keep localWeight in sync if parent changes weightOz (e.g. reset)\n  useEffect(() => { setLocalWeight(String(weightOz ?? defaultOz)); }, [weightOz, defaultOz]);\n  // Always close editor when deselected\n  useEffect(() => { if (!selected) setEditingWeight(false); }, [selected]);\n\n  const openEditor  = e => { e.stopPropagation(); setEditingWeight(true); };\n  const closeEditor = () => {\n    const v = parseFloat(localWeight);\n    if (!isNaN(v) && v >= 0) onWeightChange(v);\n    setEditingWeight(false);\n  };\n\n  return (\n    <div className={`rounded-xl border overflow-hidden transition-all ${\n      selected ? \'bg-zinc-50 border-transparent\' : \'bg-zinc-900 border-zinc-800\'\n    }`}>\n\n      {/* ── Main row ── */}\n      <div className="flex items-center gap-2.5 px-3 py-2.5">\n\n        {/* Checkbox: toggle only */}\n        <button onClick={e => { e.stopPropagation(); onToggle(); }}\n          className={`w-6 h-6 rounded-md border-2 flex-shrink-0 flex items-center justify-center flex-shrink-0 ${\n            selected ? \'bg-orange-500 border-orange-500\' : \'border-zinc-700\'\n          }`}>\n          {selected && <Check size={13} className="text-zinc-950" strokeWidth={3.5}/>}\n        </button>\n\n        {/* Label: toggle only */}\n        <button onClick={e => { e.stopPropagation(); onToggle(); }} className="flex-1 min-w-0 text-left">\n          <div className="flex items-center gap-1.5">\n            <span className="text-sm leading-none">{icon}</span>\n            <span className={`text-sm font-bold truncate ${selected ? \'text-zinc-900\' : \'text-zinc-200\'}`}>\n              {customName || label}\n            </span>\n            {isModified && selected && (\n              <span className="text-[9px] text-violet-500 font-bold flex-shrink-0">CUSTOM</span>\n            )}\n          </div>\n        </button>\n\n        {/* Controls: only show when selected */}\n        {selected ? (\n          <div className="flex items-center gap-1 flex-shrink-0">\n            {/* Qty stepper */}\n            <button onClick={e => { e.stopPropagation(); onQtyChange(Math.max(1, qtyN-1)); }}\n              className="w-6 h-6 rounded-md bg-zinc-200 text-zinc-800 text-sm font-bold flex items-center justify-center active:bg-zinc-300">−</button>\n            <span className="w-4 text-center text-xs font-bold tabular-nums text-zinc-800">{qtyN}</span>\n            <button onClick={e => { e.stopPropagation(); onQtyChange(Math.min(10, qtyN+1)); }}\n              className="w-6 h-6 rounded-md bg-zinc-200 text-zinc-800 text-sm font-bold flex items-center justify-center active:bg-zinc-300">+</button>\n            {/* Weight display: tap opens editor ONLY */}\n            <button onClick={openEditor} className="text-right min-w-[44px] ml-0.5">\n              <div className="text-sm font-bold tabular-nums text-zinc-900 leading-tight">{fmt(totalG).main}</div>\n              <div className="text-[9px] text-zinc-400 leading-tight">{fmt(totalG).sub} ✎</div>\n            </button>\n          </div>\n        ) : (\n          /* Unselected: dim default weight hint, no interaction */\n          <div className="text-right flex-shrink-0 pointer-events-none">\n            <div className="text-sm tabular-nums text-zinc-600">{weightOz ?? defaultOz}</div>\n            <div className="text-[9px] text-zinc-700">oz</div>\n          </div>\n        )}\n\n        {/* Delete button for custom items */}\n        {custom && (\n          <button onClick={e => { e.stopPropagation(); onDelete(); }}\n            className="p-1 text-zinc-500 active:text-red-400 flex-shrink-0">\n            <Trash2 size={13}/>\n          </button>\n        )}\n      </div>\n\n      {/* ── Inline weight editor — only when editingWeight is true ── */}\n      {selected && editingWeight && (\n        <div className="px-3 pb-3 pt-2 border-t border-zinc-200 bg-zinc-100">\n          <div className={`grid gap-2 mb-2 ${!custom ? \'grid-cols-2\' : \'grid-cols-1\'}`}>\n            <Field label="Weight per item (oz)">\n              <input\n                type="number" min="0" step="0.1" inputMode="decimal"\n                value={localWeight}\n                onChange={e => setLocalWeight(e.target.value)}\n                onBlur={closeEditor}\n                className="inp tabular-nums" style={{color:\'#18181b\', background:\'#e4e4e7\', borderColor:\'#a1a1aa\'}}\n                autoFocus/>\n            </Field>\n            {!custom && (\n              <Field label="Name (optional)">\n                <input value={customName} onChange={e => onNameChange(e.target.value)}\n                  placeholder={label}\n                  className="inp" style={{color:\'#18181b\', background:\'#e4e4e7\', borderColor:\'#a1a1aa\'}}/>\n              </Field>\n            )}\n          </div>\n          <div className="flex items-center justify-between">\n            <span className="text-[10px] text-zinc-500">Default: {defaultOz} oz</span>\n            <div className="flex gap-3">\n              {isModified && (\n                <button onClick={() => { onWeightChange(defaultOz); setLocalWeight(String(defaultOz)); setEditingWeight(false); }}\n                  className="text-[10px] text-violet-600 font-bold active:text-violet-800">↺ Reset</button>\n              )}\n              <button onClick={closeEditor}\n                className="text-[10px] text-zinc-500 font-bold active:text-zinc-800">DONE</button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n\n// ─── Library View ─────────────────────────────────────────────────────────────\nfunction LibraryView({items, missingCount, filterCat, setFilterCat, onAdd, onEdit, fmt}) {\n  const [search, setSearch] = useState(\'\');\n  const filtered = items.filter(it =>\n    (filterCat===\'All\' || it.category===filterCat) &&\n    (!search || `${it.name} ${it.brand}`.toLowerCase().includes(search.toLowerCase()))\n  );\n  const sorted = [...filtered].sort((a,b)=>{\n    const aw=a.weight==null||a.weight===\'\', bw=b.weight==null||b.weight===\'\';\n    if(aw&&!bw) return -1; if(!aw&&bw) return 1;\n    return a.name.localeCompare(b.name);\n  });\n  return (\n    <div>\n      <div className="flex items-end justify-between mb-3">\n        <div>\n          <div className="text-[10px] tracking-[.2em] text-zinc-500">MASTER LIBRARY</div>\n          <div className="text-2xl font-bold tabular-nums leading-none mt-0.5">{items.length}<span className="text-xs text-zinc-600 ml-1 font-normal">items</span></div>\n        </div>\n        <button onClick={onAdd} className="flex items-center gap-1.5 bg-orange-500 active:bg-orange-400 text-zinc-950 font-bold text-xs tracking-wider px-4 py-3 rounded-xl shadow-lg shadow-orange-500/20 active:scale-95 transition-all">\n          <Plus size={15} strokeWidth={3}/> ADD ITEM\n        </button>\n      </div>\n\n      {missingCount > 0 && (\n        <button onClick={()=>{const f=items.find(i=>i.weight==null||i.weight===\'\');if(f)onEdit(f);}}\n          className="w-full flex items-center gap-2.5 mb-3 p-3 rounded-xl bg-amber-950/40 border border-amber-900/40 text-left active:bg-amber-950/60">\n          <AlertCircle size={15} className="text-amber-400 flex-shrink-0"/>\n          <div className="flex-1">\n            <div className="text-xs text-amber-200 font-bold">{missingCount} item{missingCount>1?\'s\':\'\'} missing weight</div>\n            <div className="text-[10px] text-amber-300/60">Tap to edit · use ✨ Fetch Weight</div>\n          </div>\n          <ChevronRight size={14} className="text-amber-500"/>\n        </button>\n      )}\n\n      <div className="relative mb-3">\n        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search items…"\n          className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm placeholder-zinc-600 outline-none focus:border-zinc-600"/>\n        {search && <button onClick={()=>setSearch(\'\')} className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500"><X size={14}/></button>}\n      </div>\n\n      <CatFilter filterCat={filterCat} setFilterCat={setFilterCat} items={items}/>\n\n      <div className="mt-3 space-y-1.5">\n        {sorted.length===0 && <div className="text-center py-12 text-zinc-600 text-sm">No items found.</div>}\n        {sorted.map(it=><LibRow key={it.id} item={it} onEdit={()=>onEdit(it)} fmt={fmt}/>)}\n      </div>\n    </div>\n  );\n}\n\nfunction LibRow({item, onEdit, fmt}) {\n  const qty     = Math.max(1, parseInt(item.qty)||1);\n  const g       = toGrams(item.weight, item.unit);\n  const display = (item.weight==null || item.weight===\'\') ? null : fmt(g);\n  return (\n    <button onClick={onEdit}\n      className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-left active:bg-zinc-800 transition-colors ${!display?\'bg-zinc-900 border border-amber-900/30\':\'bg-zinc-900 border border-zinc-800\'}`}>\n      <div className="w-[3px] self-stretch rounded-full flex-shrink-0" style={{background:CAT_COLOR[item.category]}}/>\n      <div className="flex-1 min-w-0">\n        <div className="flex items-center gap-1.5">\n          <div className="text-sm font-bold truncate">{item.name}</div>\n          {qty > 1 && <span className="flex-shrink-0 text-[10px] font-bold bg-zinc-700 text-zinc-300 px-1.5 py-0.5 rounded-md">×{qty}</span>}\n        </div>\n        <div className="text-[10px] text-zinc-600 truncate">{[item.brand,item.details].filter(Boolean).join(\' · \')||\'—\'}</div>\n      </div>\n      <div className="text-right flex-shrink-0 min-w-[52px]">\n        {!display ? <span className="text-[11px] font-bold text-amber-500">SET</span>\n          : <><div className="text-sm font-bold tabular-nums">{display.main}</div><div className="text-[9px] text-zinc-600">{qty>1?`each · ×${qty}`:display.sub}</div></>}\n      </div>\n      <ChevronRight size={13} className="text-zinc-700 flex-shrink-0"/>\n    </button>\n  );\n}\n\n// ─── Data View ────────────────────────────────────────────────────────────────\nconst DataView = React.memo(function DataView({items, presets, state, onImport, onReset}) {\n  const totalWeighed = items.filter(i=>i.weight!=null&&i.weight!==\'\').length;\n  const [mode, setMode]       = useState(null); // null | \'export\' | \'import\'\n  const [importText, setImportText] = useState(\'\');\n  const [importErr,  setImportErr]  = useState(\'\');\n  const [exportJson, setExportJson] = useState(\'\');\n  const openExport = () => {\n    setExportJson(JSON.stringify(state, null, 2));\n    setMode(\'export\');\n  };\n\n  const copyAll = () => {\n    try {\n      navigator.clipboard.writeText(exportJson).then(()=>{}, ()=>{});\n    } catch {}\n    // Also select the textarea so user can manually copy if clipboard API blocked\n    const el = document.getElementById(\'export-ta\');\n    if (el) { el.select(); try { document.execCommand(\'copy\'); } catch {} }\n  };\n\n  const handleImport = () => {\n    setImportErr(\'\');\n    try {\n      const parsed = JSON.parse(importText.trim());\n      if (!parsed.items || !parsed.presets) throw new Error(\'Missing items or presets fields\');\n      parsed.presets = parsed.presets.map(p=>({\n        tripSim:{...DEFAULT_TRIP}, mealPlan:{meals:[]}, ...p,\n      }));\n      onImport(parsed);\n      setMode(null);\n      setImportText(\'\');\n    } catch(e) {\n      setImportErr(e.message || \'Invalid JSON\');\n    }\n  };\n\n  if (mode === \'export\') return (\n    <div className="space-y-3">\n      <div className="flex items-center gap-2">\n        <button onClick={()=>{setMode(null);setExportJson(\'\');}} className="text-zinc-500 active:text-zinc-200 p-1 -ml-1"><ChevronRight size={16} className="rotate-180"/></button>\n        <span className="text-xs font-bold tracking-wider">EXPORT DATA</span>\n      </div>\n      <p className="text-[11px] text-zinc-500 leading-relaxed">Tap the box to select all, then copy. Paste this back in Import to restore your data on any device.</p>\n      <textarea id="export-ta" readOnly value={exportJson} rows={12}\n        onClick={e=>e.target.select()}\n        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3 text-[11px] text-zinc-300 font-mono leading-relaxed outline-none resize-none"\n        style={{fontSize:\'12px\'}}/>\n      <button onClick={copyAll}\n        className="w-full py-3.5 rounded-xl bg-orange-500 text-zinc-950 text-xs font-bold tracking-wider active:bg-orange-400">\n        COPY TO CLIPBOARD\n      </button>\n      <button onClick={()=>{setMode(null);setExportJson(\'\');}} className="w-full py-3 rounded-xl bg-zinc-800 text-zinc-400 text-xs font-bold tracking-wider active:bg-zinc-700">\n        DONE\n      </button>\n    </div>\n  );\n\n  if (mode === \'import\') return (\n    <div className="space-y-3">\n      <div className="flex items-center gap-2">\n        <button onClick={()=>{setMode(null);setImportText(\'\');setImportErr(\'\');}} className="text-zinc-500 active:text-zinc-200 p-1 -ml-1"><ChevronRight size={16} className="rotate-180"/></button>\n        <span className="text-xs font-bold tracking-wider">IMPORT DATA</span>\n      </div>\n      <p className="text-[11px] text-zinc-500 leading-relaxed">Paste your previously exported JSON below, then tap Import. This will replace all current data.</p>\n      <textarea\n        value={importText} onChange={e=>{setImportText(e.target.value);setImportErr(\'\');}}\n        placeholder=\'Paste JSON here…\'\n        rows={12}\n        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3 text-[11px] text-zinc-300 font-mono leading-relaxed outline-none resize-none focus:border-zinc-500"\n        style={{fontSize:\'12px\'}}/>\n      {importErr && (\n        <div className="flex items-start gap-2 p-3 rounded-xl bg-red-950/40 border border-red-900/50">\n          <AlertCircle size={14} className="text-red-400 flex-shrink-0 mt-0.5"/>\n          <span className="text-xs text-red-300">{importErr}</span>\n        </div>\n      )}\n      <button onClick={handleImport} disabled={!importText.trim()}\n        className="w-full py-3.5 rounded-xl bg-cyan-500 text-zinc-950 text-xs font-bold tracking-wider active:bg-cyan-400 disabled:opacity-40">\n        IMPORT &amp; REPLACE DATA\n      </button>\n      <button onClick={()=>{setMode(null);setImportText(\'\');setImportErr(\'\');}}\n        className="w-full py-3 rounded-xl bg-zinc-800 text-zinc-400 text-xs font-bold tracking-wider active:bg-zinc-700">\n        CANCEL\n      </button>\n    </div>\n  );\n\n  // Default view\n  return (\n    <div className="space-y-3">\n      <div className="grid grid-cols-3 gap-2">\n        {[[\'ITEMS\',items.length],[\'WEIGHED\',totalWeighed],[\'LOADOUTS\',presets.length]].map(([l,v])=>(\n          <div key={l} className="bg-zinc-900 border border-zinc-800 rounded-xl p-3">\n            <div className="text-[9px] tracking-[.18em] text-zinc-600">{l}</div>\n            <div className="text-2xl font-bold tabular-nums mt-0.5">{v}</div>\n          </div>\n        ))}\n      </div>\n      <div className="h-px bg-zinc-800"/>\n\n      <button onClick={openExport}\n        className="w-full flex items-center gap-3 p-4 rounded-xl bg-zinc-900 border border-zinc-800 text-left active:bg-zinc-800 transition-colors">\n        <Download size={18} className="text-orange-400 flex-shrink-0"/>\n        <div className="flex-1">\n          <div className="font-bold text-sm">Export / Backup</div>\n          <div className="text-[11px] text-zinc-600 mt-0.5">Copy your data as JSON to save or transfer</div>\n        </div>\n        <ChevronRight size={14} className="text-zinc-600"/>\n      </button>\n\n      <button onClick={()=>setMode(\'import\')}\n        class
